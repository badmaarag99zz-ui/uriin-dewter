<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Өрийн дэвтэр</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 24px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 6px;
      color: #cbd5e1;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .card small {
      color: #6b7280;
    }

    .card h2 {
      margin-top: 8px;
    }

    .form,
    .debts {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .form h2,
    .debts h2 {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 10px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 11px 15px;
      cursor: pointer;
      font-size: 14px;
    }

    .add-button {
      width: 100%;
      background: #111827;
      color: white;
      font-size: 15px;
    }

    .add-button:hover {
      background: #374151;
    }

    .debt {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .debt:last-child {
      border-bottom: none;
    }

    .name {
      font-weight: bold;
      font-size: 16px;
    }

    .amount {
      color: #dc2626;
      font-weight: bold;
      margin-top: 5px;
    }

    .delete-button {
      background: #fee2e2;
      color: #b91c1c;
      margin-left: 10px;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 25px;
    }

    @media (max-width: 600px) {
      .summary {
        grid-template-columns: 1fr;
      }

      .debt {
        align-items: flex-start;
        flex-direction: column;
      }

      .delete-button {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Өрийн дэвтэр</h1>
    <p>Өр зээлээ хялбархан бүртгэе</p>
  </header>

  <div class="container">

    <div class="summary">

      <div class="card">
        <small>Нийт өр</small>
        <h2 id="totalDebt">0₮</h2>
      </div>

      <div class="card">
        <small>Өртэй хүн</small>
        <h2 id="personCount">0</h2>
      </div>

      <div class="card">
        <small>Төлөгдсөн</small>
        <h2 id="paidAmount">0₮</h2>
      </div>

    </div>

    <div class="form">

      <h2>Шинэ өр бүртгэх</h2>

      <input
        id="name"
        type="text"
        placeholder="Хүний нэр"
      >

      <input
        id="amount"
        type="number"
        placeholder="Өрийн дүн"
      >

      <button
        class="add-button"
        onclick="addDebt()"
      >
        + Өр бүртгэх
      </button>

    </div>

    <div class="debts">

      <h2>Өрийн жагсаалт</h2>

      <div id="debtList"></div>

    </div>

  </div>

  <script>

    let debts = JSON.parse(
      localStorage.getItem("debts")
    ) || [];

    function saveDebts() {

      localStorage.setItem(
        "debts",
        JSON.stringify(debts)
      );

    }

    function addDebt() {

      const name =
        document.getElementById("name").value.trim();

      const amount =
        Number(
          document.getElementById("amount").value
        );

      if (!name || !amount) {

        alert(
          "Нэр болон өрийн дүнгээ оруулна уу."
        );

        return;
      }

      debts.push({

        id: Date.now(),

        name: name,

        amount: amount

      });

      saveDebts();

      document.getElementById("name").value = "";

      document.getElementById("amount").value = "";

      renderDebts();

    }

    function deleteDebt(id) {

      if (
        !confirm(
          "Энэ өрийг устгах уу?"
        )
      ) {

        return;

      }

      debts = debts.filter(
        function(debt) {

          return debt.id !== id;

        }
      );

      saveDebts();

      renderDebts();

    }

    function renderDebts() {

      const list =
        document.getElementById("debtList");

      list.innerHTML = "";

      if (debts.length === 0) {

        list.innerHTML =
          '<div class="empty">Одоогоор бүртгэлтэй өр алга.</div>';

      }

      debts.forEach(
        function(debt) {

          const div =
            document.createElement("div");

          div.className = "debt";

          div.innerHTML = `

            <div>

              <div class="name">
                ${debt.name}
              </div>

              <div class="amount">
                ${debt.amount.toLocaleString()}₮
              </div>

            </div>

            <button
              class="delete-button"
              onclick="deleteDebt(${debt.id})"
            >
              Устгах
            </button>

          `;

          list.appendChild(div);

        }
      );

      const total =
        debts.reduce(
          function(sum, debt) {

            return sum + debt.amount;

          },
          0
        );

      document.getElementById(
        "totalDebt"
      ).textContent =
        total.toLocaleString() + "₮";

      document.getElementById(
        "personCount"
      ).textContent =
        debts.length;

    }

    renderDebts();

  </script>

</body>
</html>

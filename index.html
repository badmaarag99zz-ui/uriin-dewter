<script>
const SUPABASE_URL = "https://eyijwypbpxrdtmwwmoef.supabase.co";
const SUPABASE_KEY = "sb_publishable_lnZn7Z5-WCQJY2nKIe_ltQ_RPZXlqVK";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ӨРИЙН ӨГӨГДӨЛ
========================= */

var debts = [];
var currentUser = null;


/* =========================
   ХЭРЭГЛЭГЧ ШАЛГАХ
========================= */

async function checkUser() {

    var result =
        await supabaseClient.auth.getUser();

    if (result.error || !result.data.user) {

        currentUser = null;

        return false;
    }

    currentUser = result.data.user;

    return true;
}


/* =========================
   ӨРҮҮДИЙГ SUPABASE-ЭЭС УНШИХ
========================= */

async function loadDebts() {

    var loggedIn = await checkUser();

    if (!loggedIn) {

        debts = [];

        showDebts();

        return;
    }


    var result =
        await supabaseClient
            .from("debts")
            .select("*")
            .eq("user_id", currentUser.id);


    if (result.error) {

        console.error(result.error);

        alert(
            "Өрийн мэдээлэл ачаалахад алдаа гарлаа:\n" +
            result.error.message
        );

        debts = [];

        showDebts();

        return;
    }


    /*
       Supabase-ийн due_date
       → програмын dueDate
    */

    debts =
        (result.data || []).map(function(row) {

            return {

                id: row.id,

                user_id: row.user_id,

                name: row.name,

                phone: row.phone || "",

                amount: Number(row.amount || 0),

                paid: Number(row.paid || 0),

                dueDate: row.due_date || "",

                payments: row.payments || []

            };

        });


    showDebts();
}


/* =========================
   МӨНГӨ ФОРМАТЛАХ
========================= */

function money(number) {

    return Number(number || 0)
        .toLocaleString("mn-MN") + "₮";

}


/* =========================
   BACKUP
========================= */

function backupData() {

    var data =
        JSON.stringify(debts, null, 2);


    var blob =
        new Blob(
            [data],
            {
                type: "application/json"
            }
        );


    var url =
        URL.createObjectURL(blob);


    var a =
        document.createElement("a");


    a.href = url;


    a.download =
        "uriin-dewter-backup.json";


    a.click();


    URL.revokeObjectURL(url);
}


/* =========================
   ШИНЭ ӨР БҮРТГЭХ
========================= */

async function addDebt() {

    var loggedIn =
        await checkUser();


    if (!loggedIn) {

        alert("Эхлээд нэвтэрнэ үү.");

        return;
    }


    var name =
        document.getElementById("personName").value;


    var phone =
        document.getElementById("personPhone").value;


    var amount =
        Number(
            document.getElementById("debtAmount").value
        );


    var dueDate =
        document.getElementById("dueDate").value;


    name =
        name.replace(/^\s+|\s+$/g, "");


    if (name == "") {

        alert("Хүний нэрээ оруулна уу.");

        return;
    }


    if (isNaN(amount) || amount <= 0) {

        alert("Өрийн дүнгээ зөв оруулна уу.");

        return;
    }


    var existingDebt = null;


    for (var i = 0; i < debts.length; i++) {

        if (
            debts[i].name.toLowerCase() ==
            name.toLowerCase()
        ) {

            existingDebt = debts[i];

            break;
        }
    }


    /* ӨМНӨ БҮРТГЭЛТЭЙ ХҮН */

    if (existingDebt != null) {

        var newAmount =
            Number(existingDebt.amount) + amount;


        var updateData = {

            amount: newAmount

        };


        if (phone != "") {

            updateData.phone = phone;

        }


        if (dueDate != "") {

            updateData.due_date = dueDate;

        }


        var updateResult =
            await supabaseClient
                .from("debts")
                .update(updateData)
                .eq("id", existingDebt.id)
                .eq("user_id", currentUser.id);


        if (updateResult.error) {

            alert(
                "Өр нэмэхэд алдаа гарлаа:\n" +
                updateResult.error.message
            );

            return;
        }


        alert(
            "✅ " +
            existingDebt.name +
            " дээр " +
            money(amount) +
            " өр нэмэгдлээ."
        );

    }


    /* ШИНЭ ХҮН */

    else {

        var insertResult =
            await supabaseClient
                .from("debts")
                .insert({

                    user_id: currentUser.id,

                    name: name,

                    phone: phone,

                    amount: amount,

                    paid: 0,

                    due_date: dueDate || null,

                    payments: []

                })
                .select()
                .single();


        if (insertResult.error) {

            alert(
                "Өр бүртгэхэд алдаа гарлаа:\n" +
                insertResult.error.message
            );

            return;
        }


        alert("✅ Өр амжилттай бүртгэгдлээ.");
    }


    document.getElementById("personName").value = "";

    document.getElementById("personPhone").value = "";

    document.getElementById("debtAmount").value = "";

    document.getElementById("dueDate").value = "";


    await loadDebts();
}


/* =========================
   ТӨЛӨЛТ БҮРТГЭХ
========================= */

async function payment(id) {

    var loggedIn =
        await checkUser();


    if (!loggedIn) {

        alert("Эхлээд нэвтэрнэ үү.");

        return;
    }


    var debt = null;


    for (var i = 0; i < debts.length; i++) {

        if (String(debts[i].id) == String(id)) {

            debt = debts[i];

            break;
        }
    }


    if (debt == null) {

        alert("Өр олдсонгүй.");

        return;
    }


    var remaining =
        Number(debt.amount) -
        Number(debt.paid);


    if (remaining <= 0) {

        alert("Энэ өр бүрэн төлөгдсөн байна.");

        return;
    }


    var input =
        prompt(
            "Төлсөн мөнгөн дүн:\nҮлдэгдэл: " +
            money(remaining)
        );


    if (input == null) {

        return;
    }


    var amount =
        Number(input);


    if (isNaN(amount) || amount <= 0) {

        alert("Зөв мөнгөн дүн оруулна уу.");

        return;
    }


    if (amount > remaining) {

        alert(
            "Үлдэгдлээс их мөнгө оруулах боломжгүй."
        );

        return;
    }


    var payments =
        Array.isArray(debt.payments)
            ? debt.payments.slice()
            : [];


    payments.push({

        amount: amount,

        date:
            new Date().toLocaleString("mn-MN")

    });


    var newPaid =
        Number(debt.paid) + amount;


    var result =
        await supabaseClient
            .from("debts")
            .update({

                paid: newPaid,

                payments: payments

            })
            .eq("id", id)
            .eq("user_id", currentUser.id);


    if (result.error) {

        alert(
            "Төлөлт хадгалахад алдаа гарлаа:\n" +
            result.error.message
        );

        return;
    }


    alert(
        "✅ " +
        money(amount) +
        " төлөлт амжилттай бүртгэгдлээ."
    );


    await loadDebts();
}

function showDebts() {

    var list =
        document.getElementById("list");


    if (!list) {

        console.error("list олдсонгүй.");

        return;
    }


    var searchInput =
        document.getElementById("search");


    var sortInput =
        document.getElementById("sort");


    var search =
        searchInput
            ? searchInput.value.toLowerCase()
            : "";


    var sort =
        sortInput
            ? sortInput.value
            : "due";


    var total = 0;

    var paidTotal = 0;

    var people = 0;

    var overdue = 0;


    /* НИЙТ ДҮН */

    for (
        var i = 0;
        i < debts.length;
        i++
    ) {

        var allDebt =
            debts[i];


        var allRemaining =
            Number(allDebt.amount || 0) -
            Number(allDebt.paid || 0);


        total +=
            allRemaining;


        paidTotal +=
            Number(allDebt.paid || 0);


        if (allRemaining > 0) {

            people++;
        }


        if (
            allDebt.dueDate &&
            allRemaining > 0
        ) {

            var today =
                new Date();

            today.setHours(
                0, 0, 0, 0
            );


            var due =
                new Date(
                    allDebt.dueDate
                );

            due.setHours(
                0, 0, 0, 0
            );


            if (due < today) {

                overdue++;
            }
        }
    }


    /* ХУУЛБАРЛААД ЭРЭМБЭЛНЭ */

    var sortedDebts =
        debts.slice();


    sortedDebts.sort(
        function(a, b) {

            var remainingA =
                Number(a.amount || 0) -
                Number(a.paid || 0);


            var remainingB =
                Number(b.amount || 0) -
                Number(b.paid || 0);


            if (sort == "amount") {

                return (
                    remainingB -
                    remainingA
                );
            }


            if (sort == "name") {

                return a.name.localeCompare(
                    b.name,
                    "mn"
                );
            }


            var dateA =
                a.dueDate
                    ? new Date(a.dueDate)
                    : new Date("9999-12-31");


            var dateB =
                b.dueDate
                    ? new Date(b.dueDate)
                    : new Date("9999-12-31");


            dateA.setHours(
                0, 0, 0, 0
            );

            dateB.setHours(
                0, 0, 0, 0
            );


            if (sort == "overdue") {

                var today =
                    new Date();

                today.setHours(
                    0, 0, 0, 0
                );


                var overdueA =
                    a.dueDate &&
                    remainingA > 0 &&
                    dateA < today;


                var overdueB =
                    b.dueDate &&
                    remainingB > 0 &&
                    dateB < today;


                if (
                    overdueA &&
                    !overdueB
                ) {

                    return -1;
                }


                if (
                    !overdueA &&
                    overdueB
                ) {

                    return 1;
                }
            }


            return dateA - dateB;
        }
    );


    var html = "";

    var visibleCount = 0;


    for (
        var k = 0;
        k < sortedDebts.length;
        k++
    ) {

        var debt =
            sortedDebts[k];


        var amount =
            Number(debt.amount || 0);


        var paid =
            Number(debt.paid || 0);


        var remaining =
            amount - paid;


        var debtName =
            (debt.name || "")
                .toLowerCase();


        if (
            search != "" &&
            debtName.indexOf(search) == -1
        ) {

            continue;
        }


        visibleCount++;


        var dueText = "";


        if (
            debt.dueDate &&
            remaining > 0
        ) {

            var today2 =
                new Date();

            today2.setHours(
                0, 0, 0, 0
            );


            var due2 =
                new Date(
                    debt.dueDate
                );

            due2.setHours(
                0, 0, 0, 0
            );


            var diff =
                Math.ceil(
                    (
                        due2 -
                        today2
                    ) /
                    (
                        1000 *
                        60 *
                        60 *
                        24
                    )
                );


            if (diff < 0) {

                dueText =
                    "🔴 Хугацаа хэтэрсэн";

            } else if (diff == 0) {

                dueText =
                    "🟡 Өнөөдөр төлөх";

            } else if (diff == 1) {

                dueText =
                    "🟡 Маргааш төлөх";

            } else {

                dueText =
                    "🟢 " +
                    diff +
                    " хоног үлдсэн";
            }
        }


        html +=
            "<div class='debt'>" +


            "<div class='debt-name' " +

            "onclick=\"viewDebt('" +
            debt.id +
            "')\" " +

            "style='cursor:pointer;'>" +

            debt.name +

            "</div>" +


            "<div class='" +

            (
                remaining == 0
                    ? "remaining complete"
                    : "remaining"
            ) +

            "'>" +

            (
                remaining == 0
                    ? "Бүрэн төлөгдсөн"
                    : "Үлдэгдэл: " +
                      money(remaining)
            ) +

            "</div>" +


            "<div>Нийт өр: " +
            money(amount) +
            "</div>" +


            "<div>Төлсөн: " +
            money(paid) +
            "</div>" +


            "<div>Төлөх хугацаа: " +

            (
                debt.dueDate
                    ? debt.dueDate
                    : "Тодорхойгүй"
            ) +

            "</div>" +


            (
                dueText
                    ? "<div>" +
                      dueText +
                      "</div>"
                    : ""
            ) +


            "<div>";


        if (remaining > 0) {

            html +=
                "<button " +

                "class='pay' " +

                "onclick=\"payment('" +
                debt.id +
                "')\">" +

                "💵 Төлөлт бүртгэх" +

                "</button>";
        }


        html +=
            "<button " +

            "class='pay' " +

            "onclick=\"addMoreDebt('" +
            debt.id +
            "')\">" +

            "➕ Өр нэмэх" +

            "</button>";


        html +=
            "<button " +

            "class='pay' " +

            "onclick=\"editDebt('" +
            debt.id +
            "')\">" +

            "✏️ Засах" +

            "</button>";


        html +=
            "<button " +

            "class='delete' " +

            "onclick=\"removeDebt('" +
            debt.id +
            "')\">" +

            "🗑 Устгах" +

            "</button>" +


            "</div>" +


            "</div>";
    }


    if (debts.length == 0) {

        html =
            "<div class='empty'>" +

            "Одоогоор бүртгэлтэй өр алга." +

            "</div>";

    } else if (visibleCount == 0) {

        html =
            "<div class='empty'>" +

            "Хайсан хүн олдсонгүй." +

            "</div>";
    }


    list.innerHTML =
        html;


    document.getElementById("total").innerHTML =
        money(total);


    document.getElementById("people").innerHTML =
        people;


    document.getElementById("paid").innerHTML =
        money(paidTotal);


    document.getElementById("overdue").innerHTML =
        overdue;
}

<script>
async function registerUser() {

    const phone =
        document.getElementById("authPhone").value.trim();

    const password =
        document.getElementById("authPassword").value;

    if (!phone || !password) {
        alert("Утасны дугаар болон нууц үгээ оруулна уу.");
        return;
    }

    if (password.length < 6) {
        alert("Нууц үг хамгийн багадаа 6 тэмдэгт байна.");
        return;
    }

    const cleanPhone = phone.replace(/\D/g, "");

    if (cleanPhone.length < 8) {
        alert("Утасны дугаараа зөв оруулна уу.");
        return;
    }

    // Supabase Auth-д дотооддоо ашиглах email
    const internalEmail =
        "phone_" + cleanPhone + "@uriindewter.local";

    const { data, error } =
        await supabaseClient.auth.signUp({
            email: internalEmail,
            password: password
        });

    if (error) {
        document.getElementById("authMessage").innerText =
            "❌ " + error.message;
        return;
    }

    const user = data.user;

    if (!user) {
        document.getElementById("authMessage").innerText =
            "❌ Бүртгэл үүсгэхэд алдаа гарлаа.";
        return;
    }

    const { error: profileError } =
        await supabaseClient
            .from("profiles")
            .insert({
                id: user.id,
                phone: cleanPhone
            });

    if (profileError) {
        document.getElementById("authMessage").innerText =
            "❌ Утасны дугаар хадгалахад алдаа гарлаа: " +
            profileError.message;
        return;
    }

    document.getElementById("authMessage").innerText =
        "✅ Бүртгэл амжилттай үүслээ.";
}


async function loginUser() {

    const phone =
        document.getElementById("authPhone").value.trim();

    const password =
        document.getElementById("authPassword").value;

    if (!phone || !password) {
        alert("Утасны дугаар болон нууц үгээ оруулна уу.");
        return;
    }

    const cleanPhone = phone.replace(/\D/g, "");

    if (cleanPhone.length < 8) {
        alert("Утасны дугаараа зөв оруулна уу.");
        return;
    }

    const internalEmail =
        "phone_" + cleanPhone + "@uriindewter.local";

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: internalEmail,
            password: password
        });

    if (error) {
        document.getElementById("authMessage").innerText =
            "❌ Утасны дугаар эсвэл нууц үг буруу байна.";
        return;
    }

    currentUser = data.user;

    document.getElementById("authMessage").innerText =
        "✅ Амжилттай нэвтэрлээ.";

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("appContent").style.display = "block";

    loadDebts();
}
    async function checkLoginOnLoad() {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error) {
        console.error(error);
        return;
    }

    if (data.session) {
        currentUser = data.session.user;

        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("appContent").style.display = "block";

        loadDebts();
    } else {
        document.getElementById("loginScreen").style.display = "block";
        document.getElementById("appContent").style.display = "none";
    }
}

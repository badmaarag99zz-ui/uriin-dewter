const SUPABASE_URL = "https://eyijwypbpxrdtmwwmoef.supabase.co";
const SUPABASE_KEY = "sb_publishable_lnZn7Z5-WCQJY2nKIe_ltQ_RPZXlqVK";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,

);
/* ӨРҮҮД */

var debts = [];
var currentUser = null;

async function checkUser() {

    var result =
        await supabaseClient.auth.getUser();

    if (result.error || !result.data.user) {

        currentUser = null;

        return false;
    }

    currentUser = result.data.user;

    return true;
}

/* ХАДГАЛСАН ӨРҮҮДИЙГ УНШИХ */

async function loadDebts() {

    var loggedIn = await checkUser();

    if (!loggedIn) {
        debts = [];
        showDebts();
        return;
    }

    var result = await supabaseClient
        .from("debts")
        .select("*")
        .eq("user_id", currentUser.id);

    if (result.error) {

        console.error(result.error);

        alert("Өрийн мэдээлэл ачаалахад алдаа гарлаа.");

        debts = [];

        showDebts();

        return;
    }

   debts = result.data || [];

showDebts();
}

/* ХАДГАЛАХ */

function saveData() {

    try {

        localStorage.setItem(
            "myDebts",
            JSON.stringify(debts)
        );

    } catch(error) {

        /* хадгалалт боломжгүй байсан ч
           програм ажиллана */

    }

}
/* НӨӨЦ ФАЙЛ ТАТАХ */

function backupData() {

    var data =
        JSON.stringify(debts, null, 2);

    var blob =
        new Blob(
            [data],
            { type: "application/json" }
        );

    var url =
        URL.createObjectURL(blob);

    var a =
        document.createElement("a");

    a.href = url;

    a.download =
        "uriin-dewter-backup.json";

    a.click();

    URL.revokeObjectURL(url);

}

/* МӨНГИЙГ ФОРМАТЛАХ */

function money(number) {

    return Number(number).toLocaleString() + "₮";

}


/* ӨР НЭМЭХ */

function addDebt() {

   async function addDebt() {

    var loggedIn = await checkUser();

    if (!loggedIn) {
        alert("Эхлээд нэвтэрнэ үү.");
        return;
    }

    var name =
        document.getElementById("personName").value;

    var phone =
        document.getElementById("personPhone").value;

    var amount =
        Number(document.getElementById("debtAmount").value);

    var dueDate =
        document.getElementById("dueDate").value;

    name = name.replace(/^\s+|\s+$/g, "");

    if (name == "") {
        alert("Хүний нэрээ оруулна уу.");
        return;
    }

    if (amount <= 0 || isNaN(amount)) {
        alert("Өрийн дүнгээ зөв оруулна уу.");
        return;
    }

    var existingDebt = null;

    for (var i = 0; i < debts.length; i++) {

        if (
            debts[i].name.toLowerCase() ==
            name.toLowerCase()
        ) {

            existingDebt = debts[i];

            break;
        }
    }

    /* Өмнө бүртгэлтэй хүн бол өр дээр нь нэмнэ */

    if (existingDebt != null) {

        var newAmount =
            Number(existingDebt.amount) + amount;

        var updateData = {
            amount: newAmount
        };

        if (phone != "") {
            updateData.phone = phone;
        }

        if (dueDate != "") {
            updateData.due_date = dueDate;
        }

        var updateResult =
            await supabaseClient
                .from("debts")
                .update(updateData)
                .eq("id", existingDebt.id)
                .eq("user_id", currentUser.id);

        if (updateResult.error) {

            console.error(updateResult.error);

            alert(
                "Өр нэмэхэд алдаа гарлаа:\n" +
                updateResult.error.message
            );

            return;
        }

        alert(
            "✅ " +
            existingDebt.name +
            " дээр " +
            money(amount) +
            " өр нэмэгдлээ."
        );

    }

    /* Шинэ хүн бол шинэ өр үүсгэнэ */

    else {

        var insertResult =
            await supabaseClient
                .from("debts")
                .insert({
                    user_id: currentUser.id,
                    name: name,
                    phone: phone,
                    amount: amount,
                    paid: 0,
                    due_date: dueDate || null,
                    payments: []
                })
                .select()
                .single();

        if (insertResult.error) {

            console.error(insertResult.error);

            alert(
                "Өр бүртгэхэд алдаа гарлаа:\n" +
                insertResult.error.message
            );

            return;
        }

    }

    /* Дахин Supabase-ээс уншина */

    await loadDebts();

    document.getElementById("personName").value = "";
    document.getElementById("personPhone").value = "";
    document.getElementById("debtAmount").value = "";
    document.getElementById("dueDate").value = "";

}
/* ТӨЛӨЛТ БҮРТГЭХ */

function payment(id) {

    var debt = null;

    var i;


    for (i = 0; i < debts.length; i++) {

        if (debts[i].id == id) {

            debt = debts[i];

            break;

        }

    }


    if (debt == null) {

        return;

    }


    var remaining =
        debt.amount - debt.paid;


    var input =
        prompt(
            "Төлсөн мөнгөн дүн:\nҮлдэгдэл: " +
            money(remaining)
        );


    if (input == null) {

        return;

    }


    var amount =
        Number(input);


    if (amount <= 0 || isNaN(amount)) {

        alert("Зөв мөнгөн дүн оруулна уу.");

        return;

    }


    if (amount > remaining) {

        alert("Үлдэгдлээс их мөнгө оруулах боломжгүй.");

        return;

    }

debt.paid =
    debt.paid + amount;


if (!debt.payments) {
    debt.payments = [];
}


debt.payments.push({

    amount: amount,

   date: new Date().toLocaleString("mn-MN")

});


saveData();

showDebts();

}


/* ӨР УСТГАХ */

function removeDebt(id) {

    var answer =
        confirm("Энэ өрийг устгах уу?");


    if (!answer) {

        return;

    }


    var newDebts = [];

    var i;


    for (i = 0; i < debts.length; i++) {

        if (debts[i].id != id) {

            newDebts.push(debts[i]);

        }

    }


    debts = newDebts;


    saveData();

    showDebts();

}

<div style="
    max-width:800px;
    margin:20px auto;
    padding:20px;

">
    <h2>🔐 Бүртгэл / Нэвтрэх</h2>

    <input
        id="authEmail"
        type="email"
        placeholder="Email"
    >

    <input
        id="authPassword"
        type="password"
        placeholder="Нууц үг"
    >

    <button
        type="button"
        onclick="registerUser()"
        style="background:#111827;color:white;margin-right:5px;"
    >
        📝 Бүртгүүлэх
    </button>

    <button
        type="button"
        onclick="loginUser()"
        style="background:#2563eb;color:white;"
    >
        🔐 Нэвтрэх
    </button>

    <p id="authMessage"></p>
</div>

<script>
async function registerUser() {

    const email =
        document.getElementById("authEmail").value;

    const password =
        document.getElementById("authPassword").value;

    if (!email || !password) {
        alert("Email болон нууц үгээ оруулна уу.");
        return;
    }

    const { data, error } =
        await supabaseClient.auth.signUp({
            email: email,
            password: password
        });

    if (error) {

        document.getElementById("authMessage").innerText =
            "❌ " + error.message;

        return;
    }

    document.getElementById("authMessage").innerText =
        "✅ Бүртгэл амжилттай үүслээ.";
}


async function loginUser() {
alert("LOGIN FUNCTION ажиллаж байна");
    const email =
        document.getElementById("authEmail").value;

    const password =
        document.getElementById("authPassword").value;

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {

        document.getElementById("authMessage").innerText =
            "❌ " + error.message;

        return;
    }

    document.getElementById("authMessage").innerText =
        "✅ Амжилттай нэвтэрлээ.";

}
</script>

<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Өрийн дэвтэр</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

       * {
    box-sizing: border-box;
}

:root {
    --bg: #f3f6fb;
    --card: #ffffff;
    --text: #172033;
    --muted: #7b8496;

    --primary: #6366f1;
    --primary-dark: #4f46e5;

    --green: #16a34a;
    --red: #ef4444;
    --orange: #f59e0b;

    --border: #e7eaf1;

    --shadow: 0 8px 28px rgba(30, 41, 59, 0.06);
}

body {
    margin: 0;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* =========================
   LOGIN
========================= */

#loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background:
        radial-gradient(circle at top left, #e9e9ff 0, transparent 35%),
        radial-gradient(circle at bottom right, #e4f7ee 0, transparent 35%),
        var(--bg);
}

.login-card {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.95);
    padding: 38px 32px;
    border-radius: 28px;
    box-shadow: 0 25px 70px rgba(30,41,59,0.12);
}

.login-card h1 {
    margin: 0 0 8px;
    font-size: 30px;
    text-align: center;
}

.login-subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 28px;
}

.login-card input {
    width: 100%;
    padding: 15px 16px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-radius: 14px;
    outline: none;
    font-size: 15px;
    background: #fafbfe;
    transition: 0.2s;
}

.login-card input:focus {
    border-color: var(--primary);
    background: white;
    box-shadow: 0 0 0 4px rgba(91,92,240,0.1);
}

.login-btn,
.register-btn {
    width: 100%;
    border: 0;
    padding: 15px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

.login-btn {
    background: var(--primary);
    color: white;
}

.login-btn:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
}

.register-btn {
    margin-top: 10px;
    background: #eef0ff;
    color: var(--primary);
}

.register-btn:hover {
    background: #e2e4ff;
}

/* =========================
   HEADER
========================= */

header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(231, 234, 241, 0.8);
}

.header-inner {
    max-width: 1180px;
    margin: auto;
    padding: 17px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 850;
    letter-spacing: -0.5px;
    color: #171b2d;
}

.logout-btn {
    border: 0;
    background: #f1f3f8;
    color: #596275;
    padding: 9px 14px;
    border-radius: 11px;
    cursor: pointer;
    font-weight: 700;
    transition: 0.2s;
}

.logout-btn:hover {
    background: #e7eaf1;
    color: #30384a;
}

/* =========================
   MAIN
========================= */

.container {
    max-width: 1180px;
    margin: auto;
    padding: 28px 22px 100px;
}

/* =========================
   DASHBOARD CARDS
========================= */

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 25px;
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    box-shadow: var(--shadow);
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-2px);
}

.card-label {
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 9px;
}

.card-value {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

/* =========================
   DEBT SECTION
========================= */

.debt-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 22px;
    box-shadow: var(--shadow);
}

.debt-box h2 {
    margin: 0 0 18px;
    font-size: 20px;
}

.tools {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
}

.tools input,
.tools select {
    border: 1px solid var(--border);
    background: #f9fafc;
    border-radius: 13px;
    padding: 12px 14px;
    outline: none;
    font-size: 14px;
}

.tools input {
    flex: 1;
}

.tools input:focus,
.tools select:focus {
    border-color: var(--primary);
    background: white;
}

/* =========================
   DEBT CARD
========================= */

.debt-card {
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px 18px;
    margin-bottom: 11px;
    background: white;
    transition: 0.2s;
}

.debt-card:hover {
    border-color: #d7d9ff;
    box-shadow: 0 7px 22px rgba(30,41,59,0.06);
    transform: translateY(-1px);
}

.debt-main-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.debt-person {
    min-width: 0;
}

.person-name {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 4px;
}

.person-phone {
    font-size: 13px;
    color: var(--muted);
}

.debt-summary {
    text-align: right;
    flex-shrink: 0;
}

.debt-total {
    font-size: 17px;
    font-weight: 800;
    color: var(--red);
}

.debt-total.done {
    color: var(--green);
}

.debt-due {
    margin-top: 4px;
    font-size: 12px;
    color: var(--muted);
}

.debt-due.overdue {
    color: var(--red);
    font-weight: 700;
}

.empty {
    text-align: center;
    padding: 45px 20px;
    color: var(--muted);
}

/* =========================
   FLOATING BUTTON
========================= */

.floating-add-btn {
    position: fixed;
    left: 20px;
    right: 20px;
    bottom: 18px;
    width: auto;
    height: 54px;
    border: 0;
    border-radius: 16px;
    background: var(--primary);
    color: white;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(91,92,240,0.25);
    z-index: 60;
    transition: 0.2s;
}

.floating-add-btn:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
}

.floating-add-btn:hover {
    background: var(--primary-dark);
    transform: scale(1.06);
}

/* =========================
   MODALS
========================= */

.debt-modal,
#detailModal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(15,23,42,0.45);
    backdrop-filter: blur(5px);
}

.debt-modal.show,
#detailModal.show {
    display: flex;
}

.debt-modal-box,
.detail-box {
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    background: white;
    border-radius: 25px;
    padding: 24px;
    box-shadow: 0 25px 70px rgba(15,23,42,0.2);
}

.debt-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 22px;
}

.debt-modal-header h2 {
    margin: 0;
    font-size: 21px;
}

.debt-modal-header p {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 13px;
}

.modal-close,
.detail-close {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background: #f1f3f7;
    cursor: pointer;
    font-size: 18px;
    color: #64748b;
}

.modal-close:hover,
.detail-close:hover {
    background: #e8ebf0;
}

/* =========================
   FORM
========================= */

.debt-form label {
    display: block;
    margin: 15px 0 7px;
    font-size: 13px;
    font-weight: 700;
    color: #475569;
}

.debt-form input {
    width: 100%;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 13px;
    outline: none;
    font-size: 15px;
}

.debt-form input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(91,92,240,0.08);
}

.modal-save-btn {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: 0;
    border-radius: 14px;
    background: var(--primary);
    color: white;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
}

/* =========================
   DETAIL
========================= */

.detail-box {
    max-width: 560px;
}

.detail-balance {
    background: linear-gradient(135deg, #5b5cf0, #7475ff);
    color: white;
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 16px;
}

.detail-balance-label {
    font-size: 13px;
    opacity: 0.85;
    margin-bottom: 6px;
}

.detail-balance-value {
    font-size: 31px;
    font-weight: 900;
}

.detail-balance-value.done {
    color: #bbf7d0;
}

.detail-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 18px;
}

.detail-stat {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
}

.detail-stat-label {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 5px;
}

.detail-stat-value {
    font-size: 18px;
    font-weight: 800;
}

.detail-actions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 18px;
}

.detail-actions button {
    border: 0;
    border-radius: 14px;
    padding: 13px 10px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

.detail-actions button:hover {
    transform: translateY(-1px);
}

.detail-call {
    background: #dcfce7;
    color: #15803d;
}

.detail-edit {
    background: #eef2ff;
    color: #4f46e5;
}

.detail-pay {
    background: #fef3c7;
    color: #b45309;
}

.detail-more {
    background: #e0f2fe;
    color: #0369a1;
}

.detail-delete {
    background: #fee2e2;
    color: #dc2626;
}

/* =========================
   HISTORY
========================= */

.clickable-detail,
.clickable-detail-stat {
    cursor: pointer;
    transition: 0.18s;
}

.clickable-detail:hover {
    background: #f1f5f9;
}

.clickable-detail-stat:hover {
    background: #eef2ff;
}

.click-arrow {
    float: right;
    font-size: 12px;
    color: #64748b;
}

.history-panel {
    display: none;
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 12px 15px;
    margin: 8px 0 15px;
}

.history-panel.show {
    display: block;
}

.history-title {
    font-weight: 800;
    margin-bottom: 8px;
    color: #334155;
}

.history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 11px 0;
    border-bottom: 1px solid #e2e8f0;
}

.history-item:last-child {
    border-bottom: 0;
}

.history-item small {
    color: #64748b;
    font-size: 11px;
    text-align: right;
}

.history-empty {
    color: #64748b;
    padding: 8px 0;
    font-size: 14px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .header-inner {
        padding: 14px 16px;
    }

    header h1 {
        font-size: 19px;
    }

    .container {
        padding: 18px 14px 90px;
    }

   .cards {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.card {
    padding: 17px 15px;
    border-radius: 17px;
}

.card-value {
    font-size: 20px;
}
    .debt-box {
        padding: 15px;
        border-radius: 20px;
    }

    .debt-box h2 {
        font-size: 18px;
    }

    .tools {
        flex-direction: column;
    }

    .tools input,
    .tools select {
        width: 100%;
    }

    .debt-card {
        padding: 14px;
    }

    .person-name {
        font-size: 15px;
    }

    .debt-total {
        font-size: 15px;
    }
.floating-add-btn {
    left: 15px;
    right: 15px;
    bottom: 15px;
    width: auto;
    height: 55px;
    border-radius: 16px;
    font-size: 16px;
}
}

@media (max-width: 480px) {

    .login-card {
        padding: 30px 22px;
        border-radius: 23px;
    }

    .cards {
        gap: 8px;
    }

    .card {
        padding: 14px 12px;
    }

    .card-label {
        font-size: 11px;
    }

    .card-value {
        font-size: 17px;
    }

    .debt-main-row {
        align-items: flex-start;
    }

    .debt-summary {
        max-width: 130px;
    }

    .detail-box,
    .debt-modal-box {
        padding: 18px;
        border-radius: 21px;
    }

    .detail-balance {
        padding: 18px;
    }

    .detail-balance-value {
        font-size: 27px;
    }

    .detail-actions {
        grid-template-columns: 1fr 1fr;
    }
}

    </style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

    <div class="login-card">

        <h1>📒 Өрийн дэвтэр</h1>

        <div class="login-subtitle">
            Өрөө хялбархан бүртгэж, хянаарай
        </div>

        <input
            id="authPhone"
            type="tel"
            placeholder="Утасны дугаар"
        >

        <input
            id="authPassword"
            type="password"
            placeholder="Нууц үг"
        >

        <button
            type="button"
            class="login-btn"
            onclick="loginUser()"
        >
           Нэвтрэх
        </button>

        <div style="text-align:center; margin-top:12px;">
            <button
                type="button"
                onclick="showForgotPassword()"
                style="
                    border:none;
                    background:none;
                    color:#6366f1;
                    font-size:14px;
                    font-weight:600;
                    cursor:pointer;
                "
            >
                Нууц үг мартсан?
            </button>
        </div>

        <button
            type="button"
            class="register-btn"
            onclick="registerUser()"
        >
            Бүртгэл үүсгэх
        </button>

        <div
            id="authMessage"
            style="margin-top:15px;text-align:center;font-size:14px;"
        ></div>

    </div>

</div>


<!-- APP -->

<div id="appContent" style="display:none;">

    <header>

        <div class="header-inner">

            <h1>📒 Өрийн дэвтэр</h1>

            <button
                type="button"
                class="logout-btn"
                onclick="logoutUser()"
            >
                Гарах
            </button>

        </div>

    </header>


    <div class="container">

        <!-- DASHBOARD -->

        <div class="cards">

            <div class="card">

                <div class="card-label">
                    Нийт хүмүүс
                </div>

                <div
                    class="card-value"
                    id="totalPeople"
                >
                    0
                </div>

            </div>


            <div class="card">

                <div class="card-label">
                    Нийт өр
                </div>

                <div
                    class="card-value"
                    id="totalDebt"
                >
                    0 ₮
                </div>

            </div>


            <div class="card">

                <div class="card-label">
                    Төлсөн
                </div>

                <div
                    class="card-value"
                    id="totalPaid"
                >
                    0 ₮
                </div>

            </div>


            <div class="card">

                <div class="card-label">
                    Үлдэгдэл
                </div>

                <div
                    class="card-value"
                    id="totalRemaining"
                >
                    0 ₮
                </div>

            </div>

        </div>


        <!-- LIST -->

        <div class="debt-box">

            <h2>Өртэй хүмүүс</h2>

            <div class="tools">

                <input
                    id="search"
                    type="text"
                    placeholder="Нэр эсвэл утсаар хайх..."
                >

                <select id="sort">

                    <option value="newest">
                        Шинээр бүртгэгдсэн
                    </option>

                    <option value="oldest">
                        Хуучнаар бүртгэгдсэн
                    </option>

                    <option value="highest">
                        Өр ихээс бага
                    </option>

                    <option value="lowest">
                        Өр багаас их
                    </option>

                    <option value="due">
                        Төлөх хугацаа
                    </option>

                </select>

            </div>

            <div id="list"></div>

        </div>

    </div>


    <!-- ADD BUTTON -->
<!-- FORGOT PASSWORD MODAL -->

<div id="forgotPasswordModal" class="debt-modal">

    <div class="debt-modal-box">

        <div class="debt-modal-header">
            <div>
                <h2>Нууц үг сэргээх</h2>
                <p>Бүртгэлтэй утасны дугаараа оруулна уу</p>
            </div>

            <button
                type="button"
                class="modal-close"
                onclick="closeForgotPassword()"
            >
                ✕
            </button>
        </div>

        <div class="debt-form">

            <label>Утасны дугаар</label>

            <input
                type="tel"
                id="forgotPhone"
                placeholder="99112233"
            >

            <button
                type="button"
                class="modal-save-btn"
                onclick="sendPasswordReset()"
            >
                Үргэлжлүүлэх
            </button>

            <div
                id="forgotMessage"
                style="
                    margin-top:14px;
                    text-align:center;
                    font-size:14px;
                "
            ></div>

        </div>

    </div>

</div>
    <button
        type="button"
        class="floating-add-btn"
        onclick="openDebtModal()"
    >
        ➕ Өр бүртгэх
    </button>


    <!-- ADD MODAL -->

    <div
        id="debtModal"
        class="debt-modal"
        onclick="closeDebtModalOutside(event)"
    >

        <div
            class="debt-modal-box"
            onclick="event.stopPropagation()"
        >

            <div class="debt-modal-header">

                <div>

                    <h2 id="debtModalTitle">
                        Шинэ өр бүртгэх
                    </h2>

                    <p id="debtModalSubtitle">
                        Шинэ өрийн мэдээллийг оруулна уу
                    </p>

                </div>

                <button
                    type="button"
                    class="modal-close"
                    onclick="closeDebtModal()"
                >
                    ✕
                </button>

            </div>


            <div class="debt-form">

                <label>
                    Хүний нэр
                </label>

                <input
                    id="personName"
                    type="text"
                    placeholder="Жишээ: Бат"
                >


                <label>
                    Утасны дугаар
                </label>

                <input
                    id="personPhone"
                    type="tel"
                    placeholder="Жишээ: 99112233"
                >


                <label>
                    Өрийн дүн
                </label>

                <input
                    id="debtAmount"
                    type="number"
                    placeholder="Жишээ: 150000"
                >


                <label>
                    Төлөх хугацаа
                </label>

                <input
                    id="dueDate"
                    type="date"
                >


                <button
                    type="button"
                    class="modal-save-btn"
                    id="addButton"
                >
                    💾 Өр бүртгэх
                </button>

            </div>

        </div>

    </div>


    <!-- DETAIL MODAL -->

    <div
        id="detailModal"
        onclick="closeDetailModalOutside(event)"
    >

        <div
            class="detail-box"
            onclick="event.stopPropagation()"
        >

            <button
                type="button"
                class="detail-close"
                onclick="closeDetailModal()"
            >
                ✕
            </button>

            <div id="detailContent"></div>

        </div>

    </div>

</div>


<script>

    /* ==========================================
       SUPABASE
    ========================================== */

    const SUPABASE_URL =
        "https://eyijwypbpxrdtmwwmoef.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_lnZn7Z5-WCQJY2nKIe_ltQ_RPZXlqVK";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* ==========================================
       GLOBAL
    ========================================== */

    let debts = [];

    let editingDebtId = null;


    /* ==========================================
       HELPERS
    ========================================== */

    function formatMoney(value) {

        return Number(value || 0)
            .toLocaleString("mn-MN") + " ₮";

    }


    function normalizePhone(phone) {

        return String(phone || "")
            .replace(/\D/g,"");

    }


    function phoneEmail(phone) {

        return "phone_" +
            normalizePhone(phone) +
            "@uriindewter.local";

    }


    function showMessage(message,isError=false) {

        const el =
            document.getElementById("authMessage");

        if (!el) return;

        el.textContent = message;

        el.style.color =
            isError
                ? "#dc2626"
                : "#16a34a";

    }


    function escapeHtml(value) {

        return String(value || "")
            .replace(/&/g,"&amp;")
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;")
            .replace(/'/g,"&#039;");

    }

    ========================================== */

    async function loadDebts() {

        const {
            data: {
                user
            }
        } =
            await supabaseClient.auth.getUser();


        if (!user) return;


        const {
            data,
            error
        } =
            await supabaseClient
                .from("debts")
                .select("*")
                .eq(
                    "user_id",
                    user.id
                )
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if (error) {

            console.log(error);

            return;
        }


        debts =
            (data || []).map(row => ({

                id:
                    row.id,

                name:
                    row.name || "",

                phone:
                    row.phone || "",

                amount:
                    Number(row.amount || 0),

                paid:
                    Number(row.paid || 0),

                dueDate:
                    row.due_date || "",

                createdAt:
                    row.created_at || "",

                additions:
                    Array.isArray(row.additions)
                        ? row.additions
                        : [],

                payments:
                    Array.isArray(row.payments)
                        ? row.payments
                        : []

            }));


        showDebts();

    }


    /* ==========================================
       SHOW DEBTS
    ========================================== */

    function showDebts() {

        const list =
            document.getElementById("list");

        const search =
            document.getElementById("search")
                .value
                .trim()
                .toLowerCase();

        const sort =
            document.getElementById("sort")
                .value;


        let filtered =
            debts.filter(debt => {

                return (

                    debt.name
                        .toLowerCase()
                        .includes(search)

                    ||

                    debt.phone
                        .toLowerCase()
                        .includes(search)

                );

            });


        filtered.sort((a,b) => {

            const remainingA =
                Math.max(
                    0,
                    a.amount - a.paid
                );

            const remainingB =
                Math.max(
                    0,
                    b.amount - b.paid
                );


            if (sort === "highest") {

                return remainingB - remainingA;

            }


            if (sort === "lowest") {

                return remainingA - remainingB;

            }


            if (sort === "oldest") {

                return new Date(
                    a.createdAt || 0
                ) -
                new Date(
                    b.createdAt || 0
                );

            }


            if (sort === "due") {

                return new Date(
                    a.dueDate ||
                    "9999-12-31"
                ) -
                new Date(
                    b.dueDate ||
                    "9999-12-31"
                );

            }


            return new Date(
                b.createdAt || 0
            ) -
            new Date(
                a.createdAt || 0
            );

        });


        /* DASHBOARD */

        const totalPeople =
            debts.length;


        const totalDebt =
            debts.reduce(
                (sum,d) =>
                    sum + d.amount,
                0
            );


        const totalPaid =
            debts.reduce(
                (sum,d) =>
                    sum + d.paid,
                0
            );


        const totalRemaining =
            Math.max(
                0,
                totalDebt - totalPaid
            );


        document.getElementById("totalPeople")
            .textContent =
                totalPeople;


        document.getElementById("totalDebt")
            .textContent =
                formatMoney(totalDebt);


        document.getElementById("totalPaid")
            .textContent =
                formatMoney(totalPaid);


        document.getElementById("totalRemaining")
            .textContent =
                formatMoney(totalRemaining);


        /* EMPTY */

        if (filtered.length === 0) {

            list.innerHTML = `

                <div class="empty">

                    <div style="font-size:40px;">
                        📭
                    </div>

                    <div style="margin-top:10px;">
                        Өрийн бүртгэл алга байна.
                    </div>

                </div>

            `;

            return;
        }


        /* LIST */

        list.innerHTML =
            filtered.map(debt => {

                const remaining =
                    Math.max(
                        0,
                        debt.amount -
                        debt.paid
                    );


                const isDone =
                    remaining <= 0;


                let dueClass = "";

                let dueText =
                    debt.dueDate
                        ? `📅 ${escapeHtml(debt.dueDate)}`
                        : "📅 Төлөх хугацаа: Тодорхойгүй";


                if (
                    debt.dueDate &&
                    !isDone
                ) {

                    const today =
                        new Date();

                    today.setHours(
                        0,0,0,0
                    );


                    const due =
                        new Date(
                            debt.dueDate +
                            "T00:00:00"
                        );


                    if (due < today) {

                        dueClass =
                            "overdue";

                        dueText =
                            `⚠️ ${escapeHtml(debt.dueDate)} — Хугацаа хэтэрсэн`;

                    }

                }


                return `

                    <div
                        class="debt-card"
                        onclick="openDetailModal('${debt.id}')"
                    >

                        <div class="debt-main-row">

                            <div class="debt-person">

                                <div class="person-name">

                                    👤
                                    ${escapeHtml(debt.name)}

                                </div>


                                <div class="person-phone">

                                    ${
                                        debt.phone
                                            ? `📞 ${escapeHtml(debt.phone)}`
                                            : "📞 Утас байхгүй"
                                    }

                                </div>

                            </div>


                            <div class="debt-summary">

                                <div
                                    class="debt-total ${
                                        isDone
                                            ? "done"
                                            : ""
                                    }"
                                >

                                    ${
                                        isDone
                                            ? "ДУУССАН"
                                            : formatMoney(remaining)
                                    }

                                </div>


                                <div
                                    class="debt-due ${dueClass}"
                                >

                                    ${dueText}

                                </div>

                            </div>

                        </div>

                    </div>

                `;

            }).join("");

    }

    /* ==========================================
       ADD / EDIT
    ========================================== */

    async function addDebt() {

        if (editingDebtId) {

            await updateDebt();

            return;
        }


        const {
            data: {
                user
            }
        } =
            await supabaseClient.auth.getUser();


        if (!user) {

            alert("Эхлээд нэвтэрнэ үү.");

            return;
        }


        const name =
            document.getElementById("personName")
                .value
                .trim();


        const phone =
            document.getElementById("personPhone")
                .value
                .trim();


        const amount =
            Number(
                document.getElementById("debtAmount")
                    .value
            );


        const dueDate =
            document.getElementById("dueDate")
                .value;


        if (!name) {

            alert("Хүний нэр оруулна уу.");

            return;
        }


        if (!amount || amount <= 0) {

            alert("Өрийн дүнгээ зөв оруулна уу.");

            return;
        }


        const existing =
            debts.find(
                d =>
                    d.name
                        .trim()
                        .toLowerCase() ===
                    name
                        .trim()
                        .toLowerCase()
            );


        if (existing) {

            const newAmount =
                existing.amount +
                amount;


            const additions =
                Array.isArray(existing.additions)
                    ? [...existing.additions]
                    : [];


            additions.push({

                amount,

                createdAt:
                    new Date().toISOString()

            });


            const {
                error
            } =
                await supabaseClient
                    .from("debts")
                    .update({

                        amount:
                            newAmount,

                        phone:
                            phone ||
                            existing.phone,

                        due_date:
                            dueDate ||
                            existing.dueDate ||
                            null,

                        additions

                    })
                    .eq(
                        "id",
                        existing.id
                    )
                    .eq(
                        "user_id",
                        user.id
                    );


            if (error) {

                console.log(error);

                alert(
                    "Өр нэмэхэд алдаа гарлаа."
                );

                return;
            }


        } else {

            const {
                error
            } =
                await supabaseClient
                    .from("debts")
                    .insert({

                        user_id:
                            user.id,

                        name,

                        phone,

                        amount,

                        paid: 0,

                        due_date:
                            dueDate ||
                            null,

                        payments: [],

                        additions: [

                            {
                                amount,

                                createdAt:
                                    new Date()
                                        .toISOString()
                            }

                        ]

                    });


            if (error) {

                console.log(error);

                alert(
                    "Өр бүртгэхэд алдаа гарлаа."
                );

                return;
            }

        }


        closeDebtModal();

        await loadDebts();

    }

    /* ==========================================
       PAY DEBT
    ========================================== */

    async function payDebt(id) {

        const debt =
            debts.find(
                d => d.id === id
            );


        if (!debt) return;


        const remaining =
            Math.max(
                0,
                debt.amount -
                debt.paid
            );


        if (remaining <= 0) {

            alert(
                "Энэ өр бүрэн төлөгдсөн байна."
            );

            return;
        }


        const amountText =
            prompt(
                `${debt.name} хэдэн төгрөг төлсөн бэ?`
            );


        if (amountText === null) return;


        const paymentAmount =
            Number(amountText);


        if (
            !paymentAmount ||
            paymentAmount <= 0
        ) {

            alert(
                "Төлөлтийн дүнг зөв оруулна уу."
            );

            return;
        }


        if (
            paymentAmount >
            remaining
        ) {

            alert(
                `Үлдэгдэл ${formatMoney(remaining)} байна.`
            );

            return;
        }


        const payments =
            Array.isArray(debt.payments)
                ? [...debt.payments]
                : [];


        payments.push({

            amount:
                paymentAmount,

            createdAt:
                new Date().toISOString()

        });


        const newPaid =
            debt.paid +
            paymentAmount;


        const {
            error
        } =
            await supabaseClient
                .from("debts")
                .update({

                    paid:
                        newPaid,

                    payments

                })
                .eq(
                    "id",
                    id
                )
                .eq(
                    "user_id",
                    debt.userId || undefined
                );


        /*
           Дээрх userId байхгүй байж болох тул
           update-г id-аар дахин баталгаажуулна.
        */

        if (error) {

            const {
                error: retryError
            } =
                await supabaseClient
                    .from("debts")
                    .update({

                        paid:
                            newPaid,

                        payments

                    })
                    .eq(
                        "id",
                        id
                    );


            if (retryError) {

                console.log(retryError);

                alert(
                    "Төлөлт бүртгэхэд алдаа гарлаа."
                );

                return;
            }

        }


        await loadDebts();

        openDetailModal(id);

    }

                        ➕ Өрийн түүх
                    </div>

                    ${additionsHtml}

                </div>


                <!-- НИЙТ ӨР / ТӨЛСӨН -->

                <div class="detail-stats">

                    <div class="detail-stat">

                        <div class="detail-stat-label">
                            Нийт өр
                        </div>

                        <div class="detail-stat-value">
                            ${formatMoney(debt.amount)}
                        </div>

                    </div>


                    <div
                        class="detail-stat clickable-detail-stat"
                        onclick="toggleHistory('paymentHistory')"
                    >

                        <div class="detail-stat-label">

                            Төлсөн

                            <span class="click-arrow">
                                ▼
                            </span>

                        </div>

                        <div class="detail-stat-value">

                            ${formatMoney(debt.paid)}

                        </div>

                    </div>

                </div>


                <!-- ТӨЛӨЛТИЙН ТҮҮХ -->

                <div
                    id="paymentHistory"
                    class="history-panel"
                >

                    <div class="history-title">
                        💰 Төлөлтийн түүх
                    </div>

                    ${paymentsHtml}

                </div>


                <!-- ТӨЛӨХ ХУГАЦАА -->

                <div style="
                    padding:14px 0;
                    border-bottom:1px solid #e2e8f0;
                    margin-bottom:5px;
                ">

                    📅
                    <strong>
                        Төлөх хугацаа:
                    </strong>

                    ${
                        debt.dueDate
                            ? escapeHtml(debt.dueDate)
                            : "Тодорхойгүй"
                    }

                </div>


                <!-- ACTIONS -->

                <div class="detail-actions">

                    ${
                        debt.phone

                            ? `

                                <button
                                    type="button"
                                    class="detail-call"
                                    onclick="callPerson('${escapeHtml(debt.phone)}')"
                                >
                                    📞 Залгах
                                </button>

                              `

                            : `

                                <button
                                    type="button"
                                    class="detail-call"
                                    disabled
                                >
                                    📞 Залгах
                                </button>

                              `
                    }


                    <button
                        type="button"
                        class="detail-edit"
                        onclick="editDebt('${debt.id}')"
                    >
                        ✏️ Засах
                    </button>


                    <button
                        type="button"
                        class="detail-pay"
                        onclick="payDebt('${debt.id}')"
                    >
                        💰 Төлөлт
                    </button>


                    <button
                        type="button"
                        class="detail-more"
                        onclick="addMoreDebt('${debt.id}')"
                    >
                        ➕ Өр нэмэх
                    </button>


                    <button
                        type="button"
                        class="detail-delete"
                        onclick="deleteDebt('${debt.id}')"
                    >
                        🗑 Устгах
                    </button>

                </div>

            `;


        document.getElementById("detailModal")
            .classList.add("show");

    }


    /* ==========================================
       TOGGLE HISTORY
    ========================================== */

    function toggleHistory(id) {

        const panel =
            document.getElementById(id);

        if (!panel) return;

        panel.classList.toggle("show");

    }


    /* ==========================================
       CALL
    ========================================== */

    function callPerson(phone) {

        const cleanPhone =
            normalizePhone(phone);


        if (!cleanPhone) {

            alert(
                "Утасны дугаар байхгүй байна."
            );

            return;
        }


        window.location.href =
            "tel:" + cleanPhone;

    }


    /* ==========================================
       CLOSE DETAIL
    ========================================== */

    function closeDetailModal() {

        document.getElementById("detailModal")
            .classList.remove("show");

    }


    function closeDetailModalOutside(event) {

        if (
            event.target.id === "detailModal"
        ) {

            closeDetailModal();

        }

    }


    /* ==========================================
       EVENTS
    ========================================== */

    document
        .getElementById("addButton")
        .addEventListener(
            "click",
            addDebt
        );


    document
        .getElementById("search")
        .addEventListener(
            "input",
            showDebts
        );


    document
        .getElementById("sort")
        .addEventListener(
            "change",
            showDebts
        );


    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Escape"
            ) {

                closeDebtModal();

                closeDetailModal();

            }

        }
    );


    /* ==========================================
       START
    ========================================== */

    checkLoginOnLoad();

</script>

</body>
</html>

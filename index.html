<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Өрийн дэвтэр</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #111827;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        /* =========================
           LOGIN
        ========================= */

        #loginScreen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a, #2563eb);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
        }

        .login-card h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 28px;
        }

        .login-subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        .login-card input {
            width: 100%;
            height: 48px;
            margin-bottom: 12px;
            padding: 0 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        .login-card input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .login-btn,
        .register-btn {
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-btn {
            background: #2563eb;
            color: white;
            margin-top: 5px;
        }

        .register-btn {
            margin-top: 10px;
            background: #e2e8f0;
            color: #334155;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            padding: 18px 20px;
        }

        .header-inner {
            max-width: 1000px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        .logout-btn {
            border: 0;
            background: rgba(255,255,255,0.12);
            color: white;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 15px 100px;
        }

        /* =========================
           DASHBOARD
        ========================= */

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 18px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(15, 23, 42, 0.06);
        }

        .card-label {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
        }

        /* =========================
           DEBT LIST
        ========================= */

        .debt-box {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(15, 23, 42, 0.06);
        }

        .debt-box h2 {
            margin: 0 0 15px;
            font-size: 20px;
        }

        .tools {
            display: grid;
            grid-template-columns: 1fr 180px;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tools input,
        .tools select {
            width: 100%;
            height: 45px;
            padding: 0 12px;
            border: 1px solid #cbd5e1;
            border-radius: 11px;
            outline: none;
            background: white;
        }

        .tools input:focus,
        .tools select:focus {
            border-color: #2563eb;
        }

        /* =========================
           SIMPLE DEBT CARD
        ========================= */

        .debt-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 10px;
            background: white;
            cursor: pointer;
            transition: 0.15s;
        }

        .debt-card:hover {
            border-color: #2563eb;
            box-shadow: 0 5px 18px rgba(37, 99, 235, 0.08);
        }

        .debt-main-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .debt-person {
            min-width: 0;
        }

        .person-name {
            font-size: 18px;
            font-weight: 800;
            color: #111827;
        }

        .person-phone {
            margin-top: 5px;
            color: #64748b;
            font-size: 14px;
        }

        .debt-summary {
            text-align: right;
            flex-shrink: 0;
        }

        .debt-total {
            font-size: 18px;
            font-weight: 900;
            color: #2563eb;
        }

        .debt-total.done {
            color: #16a34a;
        }

        .debt-due {
            margin-top: 5px;
            font-size: 13px;
            color: #64748b;
        }

        .debt-due.overdue {
            color: #dc2626;
            font-weight: 700;
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }

        /* =========================
           FLOATING ADD
        ========================= */

        .floating-add-btn {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            z-index: 900;
            width: min(420px, calc(100% - 30px));
            height: 54px;
            border: 0;
            border-radius: 16px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
        }

        /* =========================
           MODALS
        ========================= */

        .debt-modal,
        #detailModal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
        }

        .debt-modal.show,
        #detailModal.show {
            display: flex;
        }

        .debt-modal-box,
        .detail-box {
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 22px;
            padding: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
        }

        .debt-modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 24px;
        }

        .debt-modal-header h2 {
            margin: 0;
            font-size: 22px;
        }

        .debt-modal-header p {
            margin: 5px 0 0;
            font-size: 13px;
            color: #64748b;
        }

        .modal-close,
        .detail-close {
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 10px;
            background: #f1f5f9;
            color: #475569;
            font-size: 18px;
            cursor: pointer;
        }

        .detail-close {
            float: right;
        }

        .debt-form label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .debt-form input {
            width: 100%;
            height: 48px;
            margin-bottom: 16px;
            padding: 0 14px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            background: #f8fafc;
            font-size: 16px;
            outline: none;
        }

        .modal-save-btn {
            width: 100%;
            height: 50px;
            border: 0;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        /* =========================
           DETAIL
        ========================= */

        .detail-balance {
            background: #f8fafc;
            border-radius: 15px;
            padding: 16px;
            margin: 20px 0;
        }

        .detail-balance-label {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 5px;
        }

        .detail-balance-value {
            font-size: 28px;
            font-weight: 900;
            color: #2563eb;
        }

        .detail-balance-value.done {
            color: #16a34a;
        }

        .detail-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .detail-stat {
            background: #f8fafc;
            padding: 13px;
            border-radius: 12px;
        }

        .detail-stat-label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 5px;
        }

        .detail-stat-value {
            font-weight: 800;
        }

        .detail-actions {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 7px;
            margin-top: 22px;
        }

        .detail-actions button {
            min-height: 48px;
            border: 0;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 12px;
        }

        .detail-call {
            background: #dcfce7;
            color: #15803d;
        }

        .detail-edit {
            background: #f1f5f9;
            color: #334155;
        }

        .detail-pay {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .detail-more {
            background: #ede9fe;
            color: #6d28d9;
        }

        .detail-delete {
            background: #fee2e2;
            color: #b91c1c;
        }

        .payment-item {
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .payment-item small {
            color: #64748b;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .tools {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 480px) {

            .container {
                padding: 15px 12px 95px;
            }

            .card {
                padding: 14px;
            }

            .card-value {
                font-size: 18px;
            }

            .debt-main-row {
                align-items: flex-start;
            }

            .debt-total {
                font-size: 16px;
            }

            .debt-modal,
            #detailModal {
                align-items: flex-end;
                padding: 0;
            }

            .debt-modal-box,
            .detail-box {
                max-width: none;
                max-height: 92vh;
                border-radius: 22px 22px 0 0;
                padding: 22px 18px;
            }

            .detail-actions {
                grid-template-columns: 1fr 1fr;
            }

            .detail-actions button:first-child {
                grid-column: span 2;
            }

            .floating-add-btn {
                bottom: 15px;
                width: calc(100% - 24px);
            }
        }
        /* =========================
   CLICKABLE HISTORY
========================= */

.clickable-detail {
    cursor: pointer;
    transition: 0.15s;
}

.clickable-detail:hover {
    background: #f1f5f9;
}

.clickable-detail-stat {
    cursor: pointer;
    transition: 0.15s;
}

.clickable-detail-stat:hover {
    background: #eef2ff;
}

.click-arrow {
    float: right;
    font-size: 12px;
    color: #64748b;
}

.history-panel {
    display: none;
    background: #f8fafc;
    border-radius: 14px;
    padding: 12px 15px;
    margin: 8px 0 15px;
}

.history-panel.show {
    display: block;
}

.history-title {
    font-weight: 800;
    margin-bottom: 8px;
    color: #334155;
}

.history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 11px 0;
    border-bottom: 1px solid #e2e8f0;
}

.history-item:last-child {
    border-bottom: 0;
}

.history-item small {
    color: #64748b;
    font-size: 11px;
    text-align: right;
}

.history-empty {
    color: #64748b;
    padding: 8px 0;
    font-size: 14px;
}
    </style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

    <div class="login-card">

        <h1>📒 Өрийн дэвтэр</h1>

        <div class="login-subtitle">
            Өрөө хялбархан бүртгэж, хянаарай
        </div>

        <input
            id="authPhone"
            type="tel"
            placeholder="Утасны дугаар"
        >

        <input
            id="authPassword"
            type="password"
            placeholder="Нууц үг"
        >

        <button
            type="button"
            class="login-btn"
            onclick="loginUser()"
        >
            Нэвтрэх
        </button>

        <button
            type="button"
            class="register-btn"
            onclick="registerUser()"
        >
            Бүртгэл үүсгэх
        </button>

        <div
            id="authMessage"
            style="margin-top:15px;text-align:center;font-size:14px;"
        ></div>

    </div>

</div>


<!-- APP -->

<div id="appContent" style="display:none;">

    <header>

        <div class="header-inner">

            <h1>📒 Өрийн дэвтэр</h1>

            <button
                type="button"
                class="logout-btn"
                onclick="logoutUser()"
            >
                Гарах
            </button>

        </div>

    </header>


    <div class="container">

        <!-- DASHBOARD -->

        <div class="cards">

            <div class="card">
                <div class="card-label">
                    Нийт хүмүүс
                </div>

                <div
                    class="card-value"
                    id="totalPeople"
                >
                    0
                </div>
            </div>

            <div class="card">
                <div class="card-label">
                    Нийт өр
                </div>

                <div
                    class="card-value"
                    id="totalDebt"
                >
                    0 ₮
                </div>
            </div>

            <div class="card">
                <div class="card-label">
                    Төлсөн
                </div>

                <div
                    class="card-value"
                    id="totalPaid"
                >
                    0 ₮
                </div>
            </div>

            <div class="card">
                <div class="card-label">
                    Үлдэгдэл
                </div>

                <div
                    class="card-value"
                    id="totalRemaining"
                >
                    0 ₮
                </div>
            </div>

        </div>


        <!-- LIST -->

        <div class="debt-box">

            <h2>Өртэй хүмүүс</h2>

            <div class="tools">

                <input
                    id="search"
                    type="text"
                    placeholder="Нэр эсвэл утсаар хайх..."
                >

                <select id="sort">

                    <option value="newest">
                        Шинээр бүртгэгдсэн
                    </option>

                    <option value="oldest">
                        Хуучнаар бүртгэгдсэн
                    </option>

                    <option value="highest">
                        Өр ихээс бага
                    </option>

                    <option value="lowest">
                        Өр багаас их
                    </option>

                    <option value="due">
                        Төлөх хугацаа
                    </option>

                </select>

            </div>

            <div id="list"></div>

        </div>

    </div>


    <!-- ADD BUTTON -->

    <button
        type="button"
        class="floating-add-btn"
        onclick="openDebtModal()"
    >
        ➕ Өр бүртгэх
    </button>


    <!-- ADD MODAL -->

    <div
        id="debtModal"
        class="debt-modal"
        onclick="closeDebtModalOutside(event)"
    >

        <div
            class="debt-modal-box"
            onclick="event.stopPropagation()"
        >

            <div class="debt-modal-header">

                <div>

                    <h2 id="debtModalTitle">
                        Шинэ өр бүртгэх
                    </h2>

                    <p id="debtModalSubtitle">
                        Шинэ өрийн мэдээллийг оруулна уу
                    </p>

                </div>

                <button
                    type="button"
                    class="modal-close"
                    onclick="closeDebtModal()"
                >
                    ✕
                </button>

            </div>


            <div class="debt-form">

                <label>
                    Хүний нэр
                </label>

                <input
                    id="personName"
                    type="text"
                    placeholder="Жишээ: Бат"
                >


                <label>
                    Утасны дугаар
                </label>

                <input
                    id="personPhone"
                    type="tel"
                    placeholder="Жишээ: 99112233"
                >


                <label>
                    Өрийн дүн
                </label>

                <input
                    id="debtAmount"
                    type="number"
                    placeholder="Жишээ: 150000"
                >


                <label>
                    Төлөх хугацаа
                </label>

                <input
                    id="dueDate"
                    type="date"
                >


                <button
                    type="button"
                    class="modal-save-btn"
                    id="addButton"
                >
                    💾 Өр бүртгэх
                </button>

            </div>

        </div>

    </div>


    <!-- DETAIL MODAL -->

    <div
        id="detailModal"
        onclick="closeDetailModalOutside(event)"
    >

        <div
            class="detail-box"
            onclick="event.stopPropagation()"
        >

            <button
                type="button"
                class="detail-close"
                onclick="closeDetailModal()"
            >
                ✕
            </button>

            <div id="detailContent"></div>

        </div>

    </div>

</div>


<script>

    /* ==========================================
       SUPABASE
    ========================================== */

    const SUPABASE_URL =
        "https://eyijwypbpxrdtmwwmoef.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_lnZn7Z5-WCQJY2nKIe_ltQ_RPZXlqVK";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* ==========================================
       GLOBAL
    ========================================== */

    let debts = [];

    let editingDebtId = null;


    /* ==========================================
       HELPERS
    ========================================== */

    function formatMoney(value) {

        return Number(value || 0)
            .toLocaleString("mn-MN") + " ₮";

    }


    function normalizePhone(phone) {

        return String(phone || "")
            .replace(/\D/g, "");

    }


    function phoneEmail(phone) {

        return "phone_" +
            normalizePhone(phone) +
            "@uriindewter.local";

    }


    function showMessage(message, isError = false) {

        const el =
            document.getElementById("authMessage");

        if (!el) return;

        el.textContent = message;

        el.style.color =
            isError ? "#dc2626" : "#16a34a";

    }


    /* ==========================================
       REGISTER
    ========================================== */

    async function registerUser() {

        const phone =
            document.getElementById("authPhone")
                .value.trim();

        const password =
            document.getElementById("authPassword")
                .value;


        if (!phone || !password) {

            showMessage(
                "Утасны дугаар болон нууц үгээ оруулна уу.",
                true
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Нууц үг хамгийн багадаа 6 тэмдэгт байна.",
                true
            );

            return;
        }


        const email =
            phoneEmail(phone);


        const {
            data,
            error
        } =
            await supabaseClient.auth.signUp({
                email,
                password
            });


        if (error) {

            showMessage(
                error.message,
                true
            );

            return;
        }


        if (!data.user) {

            showMessage(
                "Бүртгэл үүсгэхэд алдаа гарлаа.",
                true
            );

            return;
        }


        const {
            error: profileError
        } =
            await supabaseClient
                .from("profiles")
                .insert({
                    id: data.user.id,
                    phone: normalizePhone(phone)
                });


        if (profileError) {

            console.log(profileError);

            showMessage(
                "Бүртгэл үүссэн боловч профайл хадгалахад алдаа гарлаа.",
                true
            );

            return;
        }


        showMessage(
            "Бүртгэл амжилттай үүслээ. Нэвтэрнэ үү."
        );

    }


    /* ==========================================
       LOGIN
    ========================================== */

    async function loginUser() {

        const phone =
            document.getElementById("authPhone")
                .value.trim();

        const password =
            document.getElementById("authPassword")
                .value;


        if (!phone || !password) {

            showMessage(
                "Утасны дугаар болон нууц үгээ оруулна уу.",
                true
            );

            return;
        }


        const email =
            phoneEmail(phone);


        const {
            error
        } =
            await supabaseClient.auth
                .signInWithPassword({
                    email,
                    password
                });


        if (error) {

            showMessage(
                "Утасны дугаар эсвэл нууц үг буруу байна.",
                true
            );

            return;
        }


        showMessage("");

        await checkLoginOnLoad();

    }


    /* ==========================================
       LOGOUT
    ========================================== */

    async function logoutUser() {

        await supabaseClient.auth.signOut();

        debts = [];

        document.getElementById("appContent")
            .style.display = "none";

        document.getElementById("loginScreen")
            .style.display = "flex";

    }


    /* ==========================================
       LOGIN CHECK
    ========================================== */

    async function checkLoginOnLoad() {

        const {
            data: {
                session
            }
        } =
            await supabaseClient.auth.getSession();


        if (session) {

            document.getElementById("loginScreen")
                .style.display = "none";

            document.getElementById("appContent")
                .style.display = "block";

            await loadDebts();

        } else {

            document.getElementById("loginScreen")
                .style.display = "flex";

            document.getElementById("appContent")
                .style.display = "none";

        }

    }


    /* ==========================================
       LOAD
    ========================================== */

    async function loadDebts() {

        const {
            data: {
                user
            }
        } =
            await supabaseClient.auth.getUser();


        if (!user) return;


        const {
            data,
            error
        } =
            await supabaseClient
                .from("debts")
                .select("*")
                .eq("user_id", user.id)
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            console.log(error);

            return;
        }


        debts =
            (data || []).map(row => ({

                id: row.id,

                name: row.name || "",

                phone: row.phone || "",

                amount:
                    Number(row.amount || 0),

                paid:
                    Number(row.paid || 0),

                dueDate:
                    row.due_date || "",

                createdAt:
                    row.created_at || "",

                additions:
                    row.additions || [],

                payments:
                    row.payments || []

            }));


        showDebts();

    }


    /* ==========================================
       SHOW DEBTS
    ========================================== */

    function showDebts() {

        const list =
            document.getElementById("list");

        const search =
            document.getElementById("search")
                .value
                .trim()
                .toLowerCase();

        const sort =
            document.getElementById("sort")
                .value;


        let filtered =
            debts.filter(debt => {

                return (
                    debt.name
                        .toLowerCase()
                        .includes(search) ||

                    debt.phone
                        .toLowerCase()
                        .includes(search)
                );

            });


        filtered.sort((a, b) => {

            if (sort === "highest") {

                return (
                    (b.amount - b.paid) -
                    (a.amount - a.paid)
                );

            }


            if (sort === "lowest") {

                return (
                    (a.amount - a.paid) -
                    (b.amount - b.paid)
                );

            }


            if (sort === "oldest") {

                return new Date(
                    a.createdAt || 0
                ) -
                new Date(
                    b.createdAt || 0
                );

            }


            if (sort === "due") {

                return new Date(
                    a.dueDate ||
                    "9999-12-31"
                ) -
                new Date(
                    b.dueDate ||
                    "9999-12-31"
                );

            }


            return new Date(
                b.createdAt || 0
            ) -
            new Date(
                a.createdAt || 0
            );

        });


        /* DASHBOARD */

        const totalPeople =
            debts.length;


        const totalDebt =
            debts.reduce(
                (sum, d) =>
                    sum + d.amount,
                0
            );


        const totalPaid =
            debts.reduce(
                (sum, d) =>
                    sum + d.paid,
                0
            );


        const totalRemaining =
            totalDebt - totalPaid;


        document.getElementById("totalPeople")
            .textContent =
                totalPeople;


        document.getElementById("totalDebt")
            .textContent =
                formatMoney(totalDebt);


        document.getElementById("totalPaid")
            .textContent =
                formatMoney(totalPaid);


        document.getElementById("totalRemaining")
            .textContent =
                formatMoney(totalRemaining);


        /* EMPTY */

        if (filtered.length === 0) {

            list.innerHTML = `
                <div class="empty">

                    <div style="font-size:40px;">
                        📭
                    </div>

                    <div style="margin-top:10px;">
                        Өрийн бүртгэл алга байна.
                    </div>

                </div>
            `;

            return;
        }


        /* LIST */

        list.innerHTML =
            filtered.map(debt => {

                const remaining =
                    Math.max(
                        0,
                        debt.amount -
                        debt.paid
                    );


                const isDone =
                    remaining <= 0;


                let dueClass = "";

                let dueText =
                    debt.dueDate
                        ? `📅 ${debt.dueDate}`
                        : "📅 Төлөх хугацаа: Тодорхойгүй";


                if (
                    debt.dueDate &&
                    !isDone
                ) {

                    const today =
                        new Date();

                    today.setHours(
                        0, 0, 0, 0
                    );


                    const due =
                        new Date(
                            debt.dueDate +
                            "T00:00:00"
                        );


                    if (due < today) {

                        dueClass =
                            "overdue";

                        dueText =
                            `⚠️ ${debt.dueDate} — Хугацаа хэтэрсэн`;

                    }

                }


                return `

                    <div
                        class="debt-card"
                        onclick="openDetailModal('${debt.id}')"
                    >

                        <div class="debt-main-row">

                            <div class="debt-person">

                                <div class="person-name">

                                    👤
                                    ${escapeHtml(
                                        debt.name
                                    )}

                                </div>


                                <div class="person-phone">

                                    ${
                                        debt.phone
                                            ? `
                                                📞
                                                ${escapeHtml(
                                                    debt.phone
                                                )}
                                              `
                                            : `
                                                📞 Утас байхгүй
                                              `
                                    }

                                </div>

                            </div>


                            <div class="debt-summary">

                                <div
                                    class="debt-total ${
                                        isDone
                                            ? "done"
                                            : ""
                                    }"
                                >

                                    ${
                                        isDone
                                            ? "ДУУССАН"
                                            : formatMoney(
                                                remaining
                                              )
                                    }

                                </div>


                                <div
                                    class="debt-due ${dueClass}"
                                >

                                    ${dueText}

                                </div>

                            </div>

                        </div>

                    </div>

                `;

            }).join("");

    }


    /* ==========================================
       ESCAPE
    ========================================== */

    function escapeHtml(value) {

        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* ==========================================
       ADD MODAL
    ========================================== */

    function openDebtModal() {

        editingDebtId = null;


        document.getElementById("debtModalTitle")
            .textContent =
                "Шинэ өр бүртгэх";


        document.getElementById("debtModalSubtitle")
            .textContent =
                "Шинэ өрийн мэдээллийг оруулна уу";


        document.getElementById("addButton")
            .textContent =
                "💾 Өр бүртгэх";


        document.getElementById("personName")
            .value = "";

        document.getElementById("personPhone")
            .value = "";

        document.getElementById("debtAmount")
            .value = "";

        document.getElementById("dueDate")
            .value = "";


        document.getElementById("debtModal")
            .classList.add("show");


        setTimeout(() => {

            document.getElementById("personName")
                .focus();

        }, 100);

    }


    function closeDebtModal() {

        document.getElementById("debtModal")
            .classList.remove("show");

        editingDebtId = null;

    }


    function closeDebtModalOutside(event) {

        if (
            event.target.id === "debtModal"
        ) {

            closeDebtModal();

        }

    }


    /* ==========================================
       ADD / EDIT
    ========================================== */

    async function addDebt() {

        if (editingDebtId) {

            await updateDebt();

            return;
        }


        const {
            data: {
                user
            }
        } =
            await supabaseClient.auth.getUser();


        if (!user) {

            alert(
                "Эхлээд нэвтэрнэ үү."
            );

            return;
        }


        const name =
            document.getElementById("personName")
                .value
                .trim();


        const phone =
            document.getElementById("personPhone")
                .value
                .trim();


        const amount =
            Number(
                document.getElementById("debtAmount")
                    .value
            );


        const dueDate =
            document.getElementById("dueDate")
                .value;


        if (!name) {

            alert(
                "Хүний нэр оруулна уу."
            );

            return;
        }


        if (!amount || amount <= 0) {

            alert(
                "Өрийн дүнгээ зөв оруулна уу."
            );

            return;
        }


        const existing =
            debts.find(
                d =>
                    d.name
                        .trim()
                        .toLowerCase() ===
                    name
                        .trim()
                        .toLowerCase()
            );


        if (existing) {

            const newAmount =
                existing.amount +
                amount;


            const additions =
                Array.isArray(
                    existing.additions
                )
                    ? [
                        ...existing.additions
                      ]
                    : [];


            additions.push({

                amount,

                createdAt:
                    new Date()
                        .toISOString()

            });


            const {
                error
            } =
                await supabaseClient
                    .from("debts")
                    .update({

                        amount:
                            newAmount,

                        phone:
                            phone ||
                            existing.phone,

                        due_date:
                            dueDate ||
                            existing.dueDate ||
                            null,

                        additions

                    })
                    .eq(
                        "id",
                        existing.id
                    )
                    .eq(
                        "user_id",
                        user.id
                    );


            if (error) {

                console.log(error);

                alert(
                    "Өр нэмэхэд алдаа гарлаа."
                );

                return;
            }

        } else {

            const {
                error
            } =
                await supabaseClient
                    .from("debts")
                    .insert({

                        user_id:
                            user.id,

                        name,

                        phone,

                        amount,

                        paid: 0,

                        due_date:
                            dueDate ||
                            null,

                        payments: [],

                        additions: []

                    });


            if (error) {

                console.log(error);

                alert(
                    "Өр бүртгэхэд алдаа гарлаа."
                );

                return;
            }

        }


        closeDebtModal();

        await loadDebts();

    }


    /* ==========================================
       EDIT DEBT
    ========================================== */

    function editDebt(id) {

        const debt =
            debts.find(
                d => d.id === id
            );


        if (!debt) return;


        editingDebtId = id;


        document.getElementById("debtModalTitle")
            .textContent =
                "✏️ Өр засах";


        document.getElementById("debtModalSubtitle")
            .textContent =
                "Мэдээллээ өөрчлөөд хадгална уу";


        document.getElementById("personName")
            .value =
                debt.name;


        document.getElementById("personPhone")
            .value =
                debt.phone;


        document.getElementById("debtAmount")
            .value =
                debt.amount;


        document.getElementById("dueDate")
            .value =
                debt.dueDate;


        document.getElementById("addButton")
            .textContent =
                "💾 Өөрчлөлт хадгалах";


        closeDetailModal();


        document.getElementById("debtModal")
            .classList.add("show");

    }


    async function updateDebt() {

        const {
            data: {
                user
            }
        } =
            await supabaseClient.auth.getUser();


        if (!user) {

            alert(
                "Эхлээд нэвтэрнэ үү."
            );

            return;
        }


        const debt =
            debts.find(
                d => d.id === editingDebtId
            );


        if (!debt) return;


        const name =
            document.getElementById("personName")
                .value
                .trim();


        const phone =
            document.getElementById("personPhone")
                .value
                .trim();


        const amount =
            Number(
                document.getElementById("debtAmount")
                    .value
            );


        const dueDate =
            document.getElementById("dueDate")
                .value;


        if (!name) {

            alert(
                "Хүний нэр оруулна уу."
            );

            return;
        }


        if (!amount || amount <= 0) {

            alert(
                "Өрийн дүнгээ зөв оруулна уу."
            );

            return;
        }


        const {
            error
        } =
            await supabaseClient
                .from("debts")
                .update({

                    name,

                    phone,

                    amount,

                    due_date:
                        dueDate ||
                        null

                })
                .eq(
                    "id",
                    editingDebtId
                )
                .eq(
                    "user_id",
                    user.id
                );


        if (error) {

            console.log(error);

            alert(
                "Засах үед алдаа гарлаа."
            );

            return;
        }


        closeDebtModal();

        await loadDebts();

    }


    /* ==========================================
       PAY DEBT
    ========================================== */

    async function payDebt(id) {

        const debt =
            debts.find(
                d => d.id === id
            );


        if (!debt) return;


        const amountText =
            prompt(
                `${debt.name} хэдэн төгрөг төлсөн бэ?`
            );


        if (amountText === null) return;


        const paymentAmount =
            Number(amountText);


        if (
            !paymentAmount ||
            paymentAmount <= 0
        ) {

            alert(
                "Төлөлтийн дүнг зөв оруулна уу."
            );

            return;
        }


        const remaining =
            debt.amount -
            debt.paid;


        if (
            paymentAmount >
            remaining
        ) {

            alert(
                "Үлдэгдлээс их дүн төлөх боломжгүй."
            );

            return;
        }


        const payments =
            Array.isArray(
                debt.payments
            )
                ? [
                    ...debt.payments
                  ]
                : [];


        payments.push({

            amount:
                paymentAmount,

            createdAt:
                new Date()
                    .toISOString()

        });


        const newPaid =
            debt.paid +
            paymentAmount;


        const {
            error
        } =
            await supabaseClient
                .from("debts")
                .update({

                    paid:
                        newPaid,

                    payments

                })
                .eq(
                    "id",
                    id
                );


        if (error) {

            console.log(error);

            alert(
                "Төлөлт бүртгэхэд алдаа гарлаа."
            );

            return;
        }


        await loadDebts();

        openDetailModal(id);

    }


    /* ==========================================
       ADD MORE DEBT
    ========================================== */

    async function addMoreDebt(id) {

        const debt =
            debts.find(
                d => d.id === id
            );


        if (!debt) return;


        const amountText =
            prompt(
                `${debt.name}-д хэдэн төгрөгийн өр нэмэх вэ?`
            );


        if (amountText === null) return;


        const amount =
            Number(amountText);


        if (
            !amount ||
            amount <= 0
        ) {

            alert(
                "Өрийн дүнг зөв оруулна уу."
            );

            return;
        }


        const additions =
            Array.isArray(
                debt.additions
            )
                ? [
                    ...debt.additions
                  ]
                : [];


        additions.push({

            amount,

            createdAt:
                new Date()
                    .toISOString()

        });


        const {
            error
        } =
            await supabaseClient
                .from("debts")
                .update({

                    amount:
                        debt.amount +
                        amount,

                    additions

                })
                .eq(
                    "id",
                    id
                );


        if (error) {

            console.log(error);

            alert(
                "Өр нэмэхэд алдаа гарлаа."
            );

            return;
        }


        await loadDebts();

        openDetailModal(id);

    }


    /* ==========================================
       DELETE
    ========================================== */

    async function deleteDebt(id) {

        const debt =
            debts.find(
                d => d.id === id
            );


        if (!debt) return;


        const confirmed =
            confirm(
                `${debt.name}-ийн өрийг устгах уу?`
            );


        if (!confirmed) return;


        const {
            error
        } =
            await supabaseClient
                .from("debts")
                .delete()
                .eq(
                    "id",
                    id
                );


        if (error) {

            console.log(error);

            alert(
                "Устгахад алдаа гарлаа."
            );

            return;
        }


        closeDetailModal();

        await loadDebts();

    }


    /* ==========================================
       DETAIL
    ========================================== */

   function openDetailModal(id) {

    const debt = debts.find(d => d.id === id);

    if (!debt) return;

    const remaining = Math.max(
        0,
        debt.amount - debt.paid
    );

    const isDone = remaining <= 0;


    /* =========================
       НЭМЭГДСЭН ӨРҮҮД
    ========================= */

    let additionsHtml = "";

    if (
        debt.additions &&
        debt.additions.length
    ) {

        additionsHtml = debt.additions
            .slice()
            .reverse()
            .map(addition => {

                const date = addition.createdAt
                    ? new Date(
                        addition.createdAt
                    ).toLocaleString("mn-MN")
                    : "";

                return `
                    <div class="history-item">

                        <div>
                            ➕
                            <strong>
                                ${formatMoney(
                                    addition.amount
                                )}
                            </strong>
                        </div>

                        <small>
                            ${date}
                        </small>

                    </div>
                `;

            })
            .join("");

    } else {

        additionsHtml = `
            <div class="history-empty">
                Нэмсэн өр байхгүй.
            </div>
        `;

    }


    /* =========================
       ТӨЛӨЛТИЙН ТҮҮХ
    ========================= */

    let paymentsHtml = "";

    if (
        debt.payments &&
        debt.payments.length
    ) {

        paymentsHtml = debt.payments
            .slice()
            .reverse()
            .map(payment => {

                const date = payment.createdAt
                    ? new Date(
                        payment.createdAt
                    ).toLocaleString("mn-MN")
                    : "";

                return `
                    <div class="history-item">

                        <div>
                            💰
                            <strong>
                                ${formatMoney(
                                    payment.amount
                                )}
                            </strong>
                        </div>

                        <small>
                            ${date}
                        </small>

                    </div>
                `;

            })
            .join("");

    } else {

        paymentsHtml = `
            <div class="history-empty">
                Төлөлт байхгүй.
            </div>
        `;

    }


    /* =========================
       DETAIL
    ========================= */

    document.getElementById("detailContent")
        .innerHTML = `

            <h2 style="
                margin:0 0 5px;
                font-size:24px;
            ">

                👤
                ${escapeHtml(debt.name)}

            </h2>


            <div style="
                color:#64748b;
                margin-bottom:20px;
            ">

                📞
                ${
                    debt.phone
                        ? escapeHtml(debt.phone)
                        : "Утас байхгүй"
                }

            </div>


            <!-- ҮЛДЭГДЭЛ ӨР -->

            <div
                class="detail-balance clickable-detail"
                onclick="toggleHistory('additionHistory')"
            >

                <div class="detail-balance-label">

                    Үлдэгдэл өр

                    <span class="click-arrow">
                        ▼
                    </span>

                </div>


                <div class="
                    detail-balance-value
                    ${isDone ? "done" : ""}
                ">

                    ${formatMoney(debt.amount)}

                </div>


                <div style="
                    margin-top:7px;
                    font-size:13px;
                    color:#64748b;
                ">

                    Төлөгдөөгүй:
                    <strong>
                        ${formatMoney(remaining)}
                    </strong>

                </div>

            </div>


            <!-- НЭМЭГДСЭН ӨРИЙН ТҮҮХ -->

            <div
                id="additionHistory"
                class="history-panel"
            >

                <div class="history-title">
                    ➕ Нэмсэн өрийн жагсаалт
                </div>

                ${additionsHtml}

            </div>


            <!-- НИЙТ ӨР / ТӨЛСӨН -->

            <div class="detail-stats">


                <div
                    class="detail-stat"
                >

                    <div class="detail-stat-label">
                        Нийт өр
                    </div>

                    <div class="detail-stat-value">
                        ${formatMoney(debt.amount)}
                    </div>

                </div>


                <div
                    class="
                        detail-stat
                        clickable-detail-stat
                    "
                    onclick="toggleHistory('paymentHistory')"
                >

                    <div class="detail-stat-label">

                        Төлсөн

                        <span class="click-arrow">
                            ▼
                        </span>

                    </div>

                    <div class="detail-stat-value">

                        ${formatMoney(debt.paid)}

                    </div>

                </div>


            </div>


            <!-- ТӨЛӨЛТИЙН ТҮҮХ -->

            <div
                id="paymentHistory"
                class="history-panel"
            >

                <div class="history-title">
                    💰 Төлөлтийн түүх
                </div>

                ${paymentsHtml}

            </div>


            <!-- ТӨЛӨХ ХУГАЦАА -->

            <div style="
                padding:14px 0;
                border-bottom:1px solid #e2e8f0;
                margin-bottom:5px;
            ">

                📅
                <strong>
                    Төлөх хугацаа:
                </strong>

                ${
                    debt.dueDate ||
                    "Тодорхойгүй"
                }

            </div>


            <!-- ACTIONS -->

            <div class="detail-actions">


                ${
                    debt.phone
                        ? `
                            <button
                                type="button"
                                class="detail-call"
                                onclick="callPerson('${escapeHtml(
                                    debt.phone
                                )}')"
                            >
                                📞 Залгах
                            </button>
                          `
                        : `
                            <button
                                type="button"
                                class="detail-call"
                                disabled
                            >
                                📞 Залгах
                            </button>
                          `
                }


                <button
                    type="button"
                    class="detail-edit"
                    onclick="editDebt('${debt.id}')"
                >
                    ✏️ Засах
                </button>


                <button
                    type="button"
                    class="detail-pay"
                    onclick="payDebt('${debt.id}')"
                >
                    💰 Төлөлт
                </button>


                <button
                    type="button"
                    class="detail-more"
                    onclick="addMoreDebt('${debt.id}')"
                >
                    ➕ Өр нэмэх
                </button>


                <button
                    type="button"
                    class="detail-delete"
                    onclick="deleteDebt('${debt.id}')"
                >
                    🗑 Устгах
                </button>

            </div>

        `;


    document.getElementById("detailModal")
        .classList.add("show");

}


    /* ==========================================
       CALL
    ========================================== */

    function callPerson(phone) {

        const cleanPhone =
            normalizePhone(phone);


        if (!cleanPhone) {

            alert(
                "Утасны дугаар байхгүй байна."
            );

            return;
        }


        window.location.href =
            "tel:" + cleanPhone;

    }


    /* ==========================================
       CLOSE DETAIL
    ========================================== */

    function closeDetailModal() {

        document.getElementById("detailModal")
            .classList.remove("show");

    }


    function closeDetailModalOutside(event) {

        if (
            event.target.id ===
            "detailModal"
        ) {

            closeDetailModal();

        }

    }


    /* ==========================================
       EVENTS
    ========================================== */

    document
        .getElementById("addButton")
        .addEventListener(
            "click",
            addDebt
        );


    document
        .getElementById("search")
        .addEventListener(
            "input",
            showDebts
        );


    document
        .getElementById("sort")
        .addEventListener(
            "change",
            showDebts
        );


    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Escape"
            ) {

                closeDebtModal();

                closeDetailModal();

            }

        }
    );


    /* ==========================================
       START
    ========================================== */

    checkLoginOnLoad();

</script>

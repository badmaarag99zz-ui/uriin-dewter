<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Өрийн дэвтэр</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: #f2f4f7;
    font-family: Arial, sans-serif;
    color: #111;
}

header {
    background: #111827;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 8px 0 0;
}

.container {
    max-width: 800px;
    margin: 25px auto;
    padding: 0 15px;
}

.cards {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    flex: 1;
}

.card h2 {
    margin: 8px 0 0;
}

.form {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    padding: 12px 15px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

.add {
    width: 100%;
    background: #111827;
    color: white;
}

.debt-box {
    background: white;
    padding: 20px;
    border-radius: 12px;
}

.debt {
    border-bottom: 1px solid #ddd;
    padding: 15px 0;
}

.debt:last-child {
    border-bottom: 0;
}

.debt-name {
    font-size: 18px;
    font-weight: bold;
}

.remaining {
    color: #dc2626;
    font-weight: bold;
    margin-top: 5px;
}

.complete {
    color: green;
}

.pay {
    background: #dcfce7;
    color: #166534;
    margin-top: 10px;
    margin-right: 5px;
}

.delete {
    background: #fee2e2;
    color: #991b1b;
    margin-top: 10px;
}

.empty {
    text-align: center;
    color: #888;
    padding: 30px;
}

@media(max-width:600px) {
    .cards {
        display: block;
    }

    .card {
        margin-bottom: 10px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Өрийн дэвтэр</h1>
    <p>Өр зээлээ хялбархан бүртгэе</p>
</header>

<div class="container">

    <div class="cards">

        <div class="card">
            <div>Нийт үлдэгдэл өр</div>
            <h2 id="total">0₮</h2>
        </div>

        <div class="card">
            <div>Өртэй хүн</div>
            <h2 id="people">0</h2>
        </div>

        <div class="card">
            <div>Нийт төлөгдсөн</div>
            <h2 id="paid">0₮</h2>
        </div>

    </div>


    <div class="form">

        <h2>Шинэ өр бүртгэх</h2>

        <input
            id="personName"
            type="text"
            placeholder="Хүний нэр"
        >

        <input
            id="debtAmount"
            type="number"
            placeholder="Өрийн дүн"
        >

        <button
            class="add"
            id="addButton"
            type="button"
        >
            + Өр бүртгэх
        </button>

    </div>


   <div class="debt-box">

    <h2>Өрийн жагсаалт</h2>

    <input
        id="search"
        type="text"
        placeholder="🔎 Нэрээр хайх..."
        onkeyup="showDebts()"
    >

    <div id="list">
        <div class="empty">
            Одоогоор бүртгэлтэй өр алга.
        </div>
    </div>

</div>
</div>
</div>


<script>

/* ӨРҮҮД */

var debts = [];


/* ХАДГАЛСАН ӨРҮҮДИЙГ УНШИХ */

try {

    var oldData = localStorage.getItem("myDebts");

    if (oldData) {
        debts = JSON.parse(oldData);
    }

} catch(error) {

    debts = [];

}


/* ХАДГАЛАХ */

function saveData() {

    try {

        localStorage.setItem(
            "myDebts",
            JSON.stringify(debts)
        );

    } catch(error) {

        /* хадгалалт боломжгүй байсан ч
           програм ажиллана */

    }

}


/* МӨНГИЙГ ФОРМАТЛАХ */

function money(number) {

    return Number(number).toLocaleString() + "₮";

}


/* ӨР НЭМЭХ */

function addDebt() {

    var name =
        document.getElementById("personName").value;

    var amount =
        document.getElementById("debtAmount").value;


    name = name.replace(/^\s+|\s+$/g, "");

    amount = Number(amount);


    if (name == "") {

        alert("Хүний нэрээ оруулна уу.");

        return;

    }


    if (amount <= 0 || isNaN(amount)) {

        alert("Өрийн дүнгээ зөв оруулна уу.");

        return;

    }


   debts.push({

    id: new Date().getTime(),

    name: name,

    amount: amount,

    paid: 0,

    payments: []

});


    saveData();


    document.getElementById("personName").value = "";

    document.getElementById("debtAmount").value = "";


    showDebts();

}


/* ТӨЛӨЛТ БҮРТГЭХ */

function payment(id) {

    var debt = null;

    var i;


    for (i = 0; i < debts.length; i++) {

        if (debts[i].id == id) {

            debt = debts[i];

            break;

        }

    }


    if (debt == null) {

        return;

    }


    var remaining =
        debt.amount - debt.paid;


    var input =
        prompt(
            "Төлсөн мөнгөн дүн:\nҮлдэгдэл: " +
            money(remaining)
        );


    if (input == null) {

        return;

    }


    var amount =
        Number(input);


    if (amount <= 0 || isNaN(amount)) {

        alert("Зөв мөнгөн дүн оруулна уу.");

        return;

    }


    if (amount > remaining) {

        alert("Үлдэгдлээс их мөнгө оруулах боломжгүй.");

        return;

    }

debt.paid =
    debt.paid + amount;


if (!debt.payments) {
    debt.payments = [];
}


debt.payments.push({

    amount: amount,

    date: new Date().toLocaleString()

});


saveData();

showDebts();

}


/* ӨР УСТГАХ */

function removeDebt(id) {

    var answer =
        confirm("Энэ өрийг устгах уу?");


    if (!answer) {

        return;

    }


    var newDebts = [];

    var i;


    for (i = 0; i < debts.length; i++) {

        if (debts[i].id != id) {

            newDebts.push(debts[i]);

        }

    }


    debts = newDebts;


    saveData();

    showDebts();

}


/* ЖАГСААЛТ */
function viewDebt(id) {

    var debt = null;

    for (var i = 0; i < debts.length; i++) {

        if (debts[i].id == id) {
            debt = debts[i];
            break;
        }

    }

    if (debt == null) {
        return;
    }

    var remaining = debt.amount - debt.paid;

    alert(
        "👤 " + debt.name +
        "\n\n" +
        "Нийт өр: " + money(debt.amount) +
        "\nТөлсөн: " + money(debt.paid) +
        "\nҮлдэгдэл: " + money(remaining)
    );

}
function showDebts() {

    var list =
        document.getElementById("list");

    var searchInput =
        document.getElementById("search");

    var search = "";

    if (searchInput) {
        search = searchInput.value.toLowerCase();
    }

    var html = "";

    var total = 0;

    var paidTotal = 0;

    var people = 0;

    var visibleCount = 0;

    var i;


    for (i = 0; i < debts.length; i++) {

        var debt = debts[i];

        var remaining =
            debt.amount - debt.paid;


        /*
        Нийт дүнг хайлтаас үл хамаараад
        бүгдээр нь тооцно
        */

        total =
            total + remaining;

        paidTotal =
            paidTotal + debt.paid;


        if (remaining > 0) {
            people++;
        }


        /*
        Хайлтын хэсэг
        */

        var debtName =
            debt.name.toLowerCase();


        if (
            search != "" &&
            debtName.indexOf(search) == -1
        ) {

            continue;

        }


        visibleCount++;


        html +=
            '<div class="debt">' +

            '<div class="debt-name" ' +
'onclick="viewDebt(' + debt.id + ')" ' +
'style="cursor:pointer;">' +
debt.name +
'</div>' +

            '<div class="' +
            (remaining == 0
                ? "remaining complete"
                : "remaining") +
            '">' +

            (
                remaining == 0
                ? "Бүрэн төлөгдсөн"
                : "Үлдэгдэл: " +
                  money(remaining)
            ) +

            '</div>' +

            '<div>Нийт өр: ' +
            money(debt.amount) +
            '</div>' +

            '<div>Төлсөн: ' +
            money(debt.paid) +
            '</div>' +

            '<div>';


        if (remaining > 0) {

            html +=
                '<button ' +
                'class="pay" ' +
                'onclick="payment(' +
                debt.id +
                ')">' +
                '💵 Төлөлт бүртгэх' +
                '</button>';

        }


        html +=
            '<button ' +
            'class="delete" ' +
            'onclick="removeDebt(' +
            debt.id +
            ')">' +
            '🗑 Устгах' +
            '</button>' +

            '</div>' +

            '</div>';

    }


    if (debts.length == 0) {

        html =
            '<div class="empty">' +
            'Одоогоор бүртгэлтэй өр алга.' +
            '</div>';

    }
    else if (visibleCount == 0) {

        html =
            '<div class="empty">' +
            'Хайсан хүн олдсонгүй.' +
            '</div>';

    }


    list.innerHTML = html;


    document.getElementById("total").innerHTML =
        money(total);


    document.getElementById("people").innerHTML =
        people;


    document.getElementById("paid").innerHTML =
        money(paidTotal);

}

/* ТОВЧИЙГ АЖИЛЛУУЛАХ */

document.getElementById("addButton").onclick =
    function() {

        addDebt();

    };


/* ЭХЛҮҮЛЭХ */

showDebts();

</script>

</body>
</html>

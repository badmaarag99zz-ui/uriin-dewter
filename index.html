<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Өрийн дэвтэр</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f3f4f6;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 25px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 8px 0 0;
  color: #cbd5e1;
}

.container {
  max-width: 900px;
  margin: 25px auto;
  padding: 0 15px;
}

.summary {
  display: flex;
  gap: 15px;
  margin-bottom: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 14px;
  flex: 1;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.card small {
  color: #6b7280;
}

.card h2 {
  margin: 8px 0 0;
}

.form,
.debts {
  background: white;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.form h2,
.debts h2 {
  margin-top: 0;
}

input {
  width: 100%;
  padding: 13px;
  margin-bottom: 10px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  font-size: 15px;
}

button {
  border: none;
  border-radius: 9px;
  padding: 12px 15px;
  cursor: pointer;
  font-size: 14px;
}

.add-button {
  width: 100%;
  background: #111827;
  color: white;
  font-size: 16px;
}

.debt {
  padding: 15px 0;
  border-bottom: 1px solid #e5e7eb;
}

.name {
  font-weight: bold;
  font-size: 18px;
}

.amount {
  color: #dc2626;
  font-weight: bold;
  margin-top: 6px;
}

.paid {
  color: #16a34a;
}

.actions {
  margin-top: 12px;
}

.pay-button {
  background: #dcfce7;
  color: #166534;
  margin-right: 8px;
}

.delete-button {
  background: #fee2e2;
  color: #b91c1c;
}

.empty {
  text-align: center;
  color: #9ca3af;
  padding: 25px;
}

@media (max-width: 600px) {
  .summary {
    display: block;
  }

  .card {
    margin-bottom: 10px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Өрийн дэвтэр</h1>
  <p>Өр зээлээ хялбархан бүртгэе</p>
</header>

<div class="container">

  <div class="summary">

    <div class="card">
      <small>Нийт үлдэгдэл өр</small>
      <h2 id="totalDebt">0₮</h2>
    </div>

    <div class="card">
      <small>Өртэй хүн</small>
      <h2 id="personCount">0</h2>
    </div>

    <div class="card">
      <small>Нийт төлөгдсөн</small>
      <h2 id="paidAmount">0₮</h2>
    </div>

  </div>

  <div class="form">

    <h2>Шинэ өр бүртгэх</h2>

    <input
      id="name"
      type="text"
      placeholder="Хүний нэр"
    >

    <input
      id="amount"
      type="number"
      placeholder="Өрийн дүн"
    >

    <button
      class="add-button"
      onclick="addDebt()"
    >
      + Өр бүртгэх
    </button>

  </div>

  <div class="debts">

    <h2>Өрийн жагсаалт</h2>

    <div id="debtList"></div>

  </div>

</div>


<script>
alert("JAVASCRIPT АЖИЛЛАЖ БАЙНА");
</script> <script type="text/javascript">

var debts = [];


/* Хадгалсан мэдээлэл унших */
try {

  var saved = localStorage.getItem("debts");

  if (saved) {
    debts = JSON.parse(saved);
  }

} catch (e) {

  debts = [];

}


/* Хадгалах */
function saveDebts() {

  try {

    localStorage.setItem(
      "debts",
      JSON.stringify(debts)
    );

  } catch (e) {

  }

}


/* ӨР БҮРТГЭХ */
function addDebt() {

  var nameInput =
    document.getElementById("name");

  var amountInput =
    document.getElementById("amount");

  var name =
    nameInput.value;

  var amount =
    Number(amountInput.value);


  name = name.replace(/^\s+|\s+$/g, "");


  if (name == "") {

    alert("Хүний нэр оруулна уу.");

    return;
  }


  if (amount <= 0 || isNaN(amount)) {

    alert("Зөв өрийн дүн оруулна уу.");

    return;
  }


  var newDebt = {

    id: new Date().getTime(),

    name: name,

    amount: amount,

    paid: 0

  };


  debts.push(newDebt);


  saveDebts();


  nameInput.value = "";

  amountInput.value = "";


  renderDebts();

}


/* ТӨЛӨЛТ */
function makePayment(id) {

  var debt = null;

  var i;


  for (i = 0; i < debts.length; i++) {

    if (debts[i].id == id) {

      debt = debts[i];

      break;

    }

  }


  if (debt == null) {

    return;

  }


  var remaining =
    debt.amount - debt.paid;


  var payment =
    prompt(
      "Хэдэн төгрөг төлсөн бэ?\nҮлдэгдэл: " +
      remaining.toLocaleString() +
      "₮"
    );


  if (payment == null) {

    return;

  }


  payment = Number(payment);


  if (payment <= 0 || isNaN(payment)) {

    alert("Зөв дүн оруулна уу.");

    return;

  }


  if (payment > remaining) {

    alert(
      "Төлөх дүн үлдэгдлээс их байна."
    );

    return;

  }


  debt.paid =
    debt.paid + payment;


  saveDebts();

  renderDebts();

}


/* УСТГАХ */
function deleteDebt(id) {

  if (!confirm("Энэ өрийг устгах уу?")) {

    return;

  }


  var newList = [];

  var i;


  for (i = 0; i < debts.length; i++) {

    if (debts[i].id != id) {

      newList.push(debts[i]);

    }

  }


  debts = newList;


  saveDebts();

  renderDebts();

}


/* ДЭЛГЭЦЭН ДЭЭР ХАРУУЛАХ */
function renderDebts() {

  var list =
    document.getElementById("debtList");


  var totalDebt = 0;

  var totalPaid = 0;

  var personCount = 0;

  var html = "";

  var i;


  if (debts.length == 0) {

    html =
      '<div class="empty">' +
      'Одоогоор бүртгэлтэй өр алга.' +
      '</div>';

  }


  for (i = 0; i < debts.length; i++) {

    var debt = debts[i];

    var remaining =
      debt.amount - debt.paid;


    totalDebt =
      totalDebt + remaining;


    totalPaid =
      totalPaid + debt.paid;


    if (remaining > 0) {

      personCount++;

    }


    html +=
      '<div class="debt">' +

      '<div class="name">' +
      debt.name +
      '</div>' +

      '<div class="' +
      (remaining == 0 ? "amount paid" : "amount") +
      '">' +

      (remaining == 0
        ? "Бүрэн төлөгдсөн"
        : "Үлдэгдэл: " +
          remaining.toLocaleString() +
          "₮") +

      '</div>' +

      '<div>Нийт өр: ' +
      debt.amount.toLocaleString() +
      '₮</div>' +

      '<div>Төлсөн: ' +
      debt.paid.toLocaleString() +
      '₮</div>' +

      '<div class="actions">';


    if (remaining > 0) {

      html +=
        '<button ' +
        'class="pay-button" ' +
        'onclick="makePayment(' +
        debt.id +
        ')">' +
        '💵 Төлөлт бүртгэх' +
        '</button>';

    }


    html +=
      '<button ' +
      'class="delete-button" ' +
      'onclick="deleteDebt(' +
      debt.id +
      ')">' +
      '🗑 Устгах' +
      '</button>' +

      '</div>' +

      '</div>';

  }


  list.innerHTML = html;


  document.getElementById(
    "totalDebt"
  ).innerHTML =
    totalDebt.toLocaleString() + "₮";


  document.getElementById(
    "personCount"
  ).innerHTML =
    personCount;


  document.getElementById(
    "paidAmount"
  ).innerHTML =
    totalPaid.toLocaleString() + "₮";

}


/* ЭХЛЭХ */
renderDebts();

</script>

</body>
</html>
